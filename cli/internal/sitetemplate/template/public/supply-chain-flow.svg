<svg viewBox="0 0 940 500" width="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box-rect {
      fill: #f3f4f6;
      stroke-width: 2px;
    }
    .rect-platform {
      stroke: #1e66f5;
    }
    .rect-security {
      stroke: #40a02b;
    }
    .rect-dev {
      stroke: #8839ef;
    }

    .text-title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: bold;
    }
    .text-platform {
      fill: #1e66f5;
    }
    .text-security {
      fill: #40a02b;
    }
    .text-dev {
      fill: #8839ef;
    }

    .text-desc {
      fill: #5c5f77;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 9.5px;
    }

    .cli-box {
      fill: #e5e7eb;
    }
    .cli-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 8px;
      font-weight: bold;
      fill: #1f2937;
    }

    .connector-line {
      stroke: #7287fd;
      stroke-width: 1.5;
      stroke-dasharray: 4,4;
    }
    .arrow-head {
      fill: #7287fd;
    }

    .text-label {
      fill: #4b5563;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 8px;
      font-weight: bold;
    }
    .text-label-halo {
      fill: none;
      stroke: #eff1f5;
      stroke-width: 5px;
      stroke-linejoin: round;
      stroke-linecap: round;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 8px;
      font-weight: bold;
    }

    .boundary-line {
      stroke: #94a3b8;
      stroke-width: 1px;
      stroke-dasharray: 4,4;
      opacity: 0.5;
    }
    .sector-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 8.5px;
      font-weight: bold;
      fill: #64748b;
      letter-spacing: 0.05em;
    }
    .text-legend {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 9.5px;
      fill: #4b5563;
    }
    .fill-platform {
      fill: #1e66f5;
    }
    .fill-security {
      fill: #40a02b;
    }
    .fill-dev {
      fill: #8839ef;
    }

    @media (prefers-color-scheme: dark) {
      .box-rect {
        fill: #11111b;
      }
      .rect-platform {
        stroke: #89b4fa;
      }
      .rect-security {
        stroke: #a6e3a1;
      }
      .rect-dev {
        stroke: #cba6f7;
      }
      
      .text-platform {
        fill: #89b4fa;
      }
      .text-security {
        fill: #a6e3a1;
      }
      .text-dev {
        fill: #cba6f7;
      }

      .text-desc {
        fill: #a6adc8;
      }
      .cli-box {
        fill: #1e1e2e;
        stroke: #313244;
        stroke-width: 1px;
      }
      .cli-text {
        fill: #cdd6f4;
      }
      .connector-line {
        stroke: #b4befe;
      }
      .arrow-head {
        fill: #b4befe;
      }
      .text-label {
        fill: #cdd6f4;
      }
      .text-label-halo {
        stroke: #1e1e2e;
      }
      .boundary-line {
        stroke: #45475a;
      }
      .sector-text {
        fill: #8992b0;
      }
      .text-legend {
        fill: #a6adc8;
      }
      .fill-platform {
        fill: #89b4fa;
      }
      .fill-security {
        fill: #a6e3a1;
      }
      .fill-dev {
        fill: #cba6f7;
      }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-head" d="M 0 1.5 L 8 5 L 0 8.5 z" stroke="none" />
    </marker>
  </defs>

  <!-- Cross-line boundary dividers -->
  <line x1="15" y1="240" x2="925" y2="240" class="boundary-line" />
  <line x1="305" y1="15" x2="305" y2="415" class="boundary-line" />
  <line x1="635" y1="15" x2="635" y2="415" class="boundary-line" />

  <!-- Column Sector Labels -->
  <text x="140" y="30" text-anchor="middle" class="sector-text">A. WORKSPACES (LOCAL &amp; CI RUNNER)</text>
  <text x="470" y="30" text-anchor="middle" class="sector-text">B. AUTOMATED PIPELINES (CI/CD)</text>
  <text x="800" y="30" text-anchor="middle" class="sector-text">C. REGISTRY &amp; RUNTIME (GHCR &amp; K8S)</text>

  <!-- Node 1: Configure the Fleet -->
  <rect x="40" y="55" width="200" height="125" rx="12" class="box-rect rect-platform" />
  <text x="55" y="79" class="text-title text-platform">1. Configure Fleet</text>
  <rect x="52" y="87" width="176" height="18" rx="4" class="cli-box" />
  <text x="140" y="99" text-anchor="middle" class="cli-text">clearcutt platform init</text>
  <text x="55" y="121" class="text-desc">Defines language, arch, and</text>
  <text x="55" y="135" class="text-desc">security tiers in a unified</text>
  <text x="55" y="149" class="text-desc">clearcutt.fleet.yaml matrix.</text>

  <!-- Node 2: Compile Hardened Bases -->
  <rect x="370" y="55" width="200" height="125" rx="12" class="box-rect rect-platform" />
  <text x="385" y="79" class="text-title text-platform">2. Compile Bases</text>
  <rect x="382" y="87" width="176" height="18" rx="4" class="cli-box" />
  <text x="470" y="99" text-anchor="middle" class="cli-text">clearcutt catalog build</text>
  <text x="385" y="121" class="text-desc">Nix builds reproducible,</text>
  <text x="385" y="135" class="text-desc">shell-less base runtimes.</text>
  <text x="385" y="149" class="text-desc">SBOMs &amp; scans are cached.</text>

  <!-- Node 3: Publish & Attest (Registry Hub) -->
  <rect x="700" y="55" width="200" height="125" rx="12" class="box-rect rect-security" />
  <text x="715" y="79" class="text-title text-security">3. Publish &amp; Attest</text>
  <rect x="712" y="87" width="176" height="18" rx="4" class="cli-box" />
  <text x="800" y="99" text-anchor="middle" class="cli-text">clearcutt scan / vex</text>
  <text x="715" y="121" class="text-desc">GitHub OIDC OCI publication.</text>
  <text x="715" y="135" class="text-desc">Signs bases, attaches SLSA</text>
  <text x="715" y="149" class="text-desc">and OpenVEX CVE exceptions.</text>

  <!-- Node 4: Developer App Build -->
  <rect x="40" y="285" width="200" height="125" rx="12" class="box-rect rect-dev" />
  <text x="55" y="309" class="text-title text-dev">4. Package App Layer</text>
  <rect x="52" y="317" width="176" height="18" rx="4" class="cli-box" />
  <text x="140" y="329" text-anchor="middle" class="cli-text">clearcutt app build</text>
  <text x="55" y="351" class="text-desc">Daemonless, rootless CI build.</text>
  <text x="55" y="365" class="text-desc">Isolates app binary into</text>
  <text x="55" y="379" class="text-desc">a single OCI layer over base.</text>

  <!-- Node 5: Zero-Friction Rebase -->
  <rect x="370" y="285" width="200" height="125" rx="12" class="box-rect rect-dev" />
  <text x="385" y="309" class="text-title text-dev">5. Swap Bases (Rebase)</text>
  <rect x="382" y="317" width="176" height="18" rx="4" class="cli-box" />
  <text x="470" y="329" text-anchor="middle" class="cli-text">clearcutt app rebase</text>
  <text x="385" y="351" class="text-desc">Swaps base layers in seconds</text>
  <text x="385" y="365" class="text-desc">without recompiling code.</text>
  <text x="385" y="379" class="text-desc">Verified via OIDC developer keys.</text>

  <!-- Node 6: Admission Control -->
  <rect x="700" y="285" width="200" height="125" rx="12" class="box-rect rect-security" />
  <text x="715" y="309" class="text-title text-security">6. Enforce Admission</text>
  <rect x="712" y="317" width="176" height="18" rx="4" class="cli-box" />
  <text x="800" y="329" text-anchor="middle" class="cli-text">clearcutt policy / verify</text>
  <text x="715" y="351" class="text-desc">Generates Kyverno policy rules.</text>
  <text x="715" y="365" class="text-desc">Blocks unsigned, stale, or</text>
  <text x="715" y="379" class="text-desc">vulnerable containers in K8s.</text>

  <!-- Connector Lines -->
  <!-- 1. Configure -> Compile -->
  <path d="M 240 117.5 L 362 117.5" class="connector-line" marker-end="url(#arrow)" />
  <text x="305" y="108" text-anchor="middle" class="text-label-halo">Configuration</text>
  <text x="305" y="108" text-anchor="middle" class="text-label">Configuration</text>

  <!-- 2. Compile -> Publish -->
  <path d="M 570 117.5 L 692 117.5" class="connector-line" marker-end="url(#arrow)" />
  <text x="635" y="108" text-anchor="middle" class="text-label-halo">Bases + Scans</text>
  <text x="635" y="108" text-anchor="middle" class="text-label">Bases + Scans</text>

  <!-- 3. Publish -> App Build (Diagonal down-left) -->
  <path d="M 700 150 L 248 315" class="connector-line" marker-end="url(#arrow)" />
  <text x="470" y="222" text-anchor="middle" class="text-label-halo">Pull Hardened Base</text>
  <text x="470" y="222" text-anchor="middle" class="text-label">Pull Hardened Base</text>

  <!-- 4. Publish -> Rebase (Diagonal down-left) -->
  <path d="M 700 170 L 578 315" class="connector-line" marker-end="url(#arrow)" />
  <text x="635" y="237" text-anchor="middle" class="text-label-halo">Pull Base Patches</text>
  <text x="635" y="237" text-anchor="middle" class="text-label">Pull Base Patches</text>

  <!-- 5. Publish -> Enforce Admission (Vertical down) -->
  <path d="M 800 180 L 800 277" class="connector-line" marker-end="url(#arrow)" />
  <text x="800" y="232.5" text-anchor="middle" class="text-label-halo">Verify Signatures</text>
  <text x="800" y="232.5" text-anchor="middle" class="text-label">Verify Signatures</text>

  <!-- 6. Package App -> Swap Bases -->
  <path d="M 240 347.5 L 362 347.5" class="connector-line" marker-end="url(#arrow)" />
  <text x="305" y="338" text-anchor="middle" class="text-label-halo">App OCI Image</text>
  <text x="305" y="338" text-anchor="middle" class="text-label">App OCI Image</text>

  <!-- 7. Swap Bases -> Enforce Admission -->
  <path d="M 570 347.5 L 692 347.5" class="connector-line" marker-end="url(#arrow)" />
  <text x="635" y="338" text-anchor="middle" class="text-label-halo">Rebased OCI Image</text>
  <text x="635" y="338" text-anchor="middle" class="text-label">Rebased OCI Image</text>

  <!-- Legend Section at bottom -->
  <rect x="100" y="430" width="740" height="40" rx="8" class="cli-box" />
  
  <!-- Legend Item 1 -->
  <circle cx="170" cy="450" r="5" class="fill-platform" />
  <text x="182" y="453.5" class="text-legend">Platform Infrastructure</text>

  <!-- Legend Item 2 -->
  <circle cx="420" cy="450" r="5" class="fill-security" />
  <text x="432" y="453.5" class="text-legend">Security &amp; Attestation Gates</text>

  <!-- Legend Item 3 -->
  <circle cx="680" cy="450" r="5" class="fill-dev" />
  <text x="692" y="453.5" class="text-legend">App Dev Workspace</text>
</svg>
