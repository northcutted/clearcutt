# A FIXTURE, not policy. It pairs with openssl-3.6.3.grype.json — a real grype
# scan — so the classifier is exercised against real scanner output and a real
# acceptance document.
#
# This is deliberately not the repo's live core/vulnerability-acceptances.yaml.
# That file records what the shipped fleet currently accepts, which is a product
# decision that changes; binding this test to it meant narrowing the fleet broke
# a test about whether the classifier works. What the fleet accepts today is
# guarded separately, by TestShippedAcceptancesAreLoadableAndUnexpired.
#
# These are the real dates from when this acceptance was live. Tests pass an
# explicit `now` rather than time.Now(), so the fixture cannot rot into a
# failure the day it expires.
apiVersion: clearcutt.dev/v1
kind: VulnerabilityAcceptances
acceptances:
  - id: openssl-awaiting-3.6.4
    package: openssl
    versions:
      - "3.6.3"
    fixedIn: "3.6.4"
    reason: >-
      Every one of these is fixed in openssl 3.6.4. The pinned nixpkgs
      (2026-08-29, the newest revision available) ships 3.6.3, so there is no
      version of this package reachable from the current pin that clears them.
    acceptedBy: ClearCutt maintainers
    acceptedAt: "2026-08-31"
    expiresAt: "2026-10-31"
    vulnerabilities:
      - CVE-2026-14456
      - CVE-2026-14457
      - CVE-2026-18798
      - CVE-2026-54874
      - CVE-2026-54876
      - CVE-2026-63072
      - CVE-2026-63075
      - CVE-2026-63076
