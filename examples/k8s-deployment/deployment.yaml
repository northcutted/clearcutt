# ClearCutt app deployment example.
#
# This deploys an application image built from a ClearCutt base, not the base
# runtime image itself. Build and certify the app image first, then admit it.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: apps
  labels:
    app: payments-api
    clearcutt.dev/base: java21-distroless
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        clearcutt.dev/base: java21-distroless
    spec:
      containers:
        - name: payments-api
          image: ghcr.io/acme/payments-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: ephemeral-tmp
              mountPath: /tmp
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      volumes:
        - name: ephemeral-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
