# OpenShift RoleBinding: Security Context Constraint (SCC) Mapping
# Paradigm: Declarative GitOps assignment of unprivileged SCC policies
# Brand Owner & Principal Architect: Eddie Northcutt

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clearcutt-openshift-scc-binding
  namespace: clearcutt-sandbox
  labels:
    app: clearcutt-openshift
subjects:
  - kind: ServiceAccount
    name: clearcutt-openshift-sa
    namespace: clearcutt-sandbox
roleRef:
  kind: ClusterRole
  # Binds the ServiceAccount explicitly to OpenShift's standard restricted-v2
  # user role. In most default OCP clusters, this is applied automatically
  # to system:serviceaccounts, but declaring it explicitly in GitOps
  # ensures continuous audit compliance.
  name: system:openshift:scc:restricted-v2
  apiGroup: rbac.authorization.k8s.io
