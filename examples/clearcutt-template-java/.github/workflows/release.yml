name: Secure Build & Certify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # In downstream projects, this would reference the canonical repository:
      # uses: eddie-northcutt/clearcutt-images/.github/actions/build-certify@v1
      - name: Run ClearCutt Build & Certify Reusable Action
        uses: ./.github/actions/build-certify
        with:
          language: 'java21'
          tier: 'distroless'
          image-name: 'ghcr.io/${{ github.repository }}/clearcutt-template-java:latest'
