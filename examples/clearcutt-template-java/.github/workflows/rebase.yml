name: Rebase on Patched ClearCutt Base

on:
  workflow_dispatch:
    inputs:
      image:
        description: Source app image digest to rebase
        required: true
      candidate-base:
        description: Patched ClearCutt base reference
        required: true
        default: ghcr.io/northcutted/clearcutt/clearcutt-java21:distroless
      tag:
        description: Target rebased image reference
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v4

      - name: Install ClearCutt CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.11.1"
          curl -fsSL -o "${RUNNER_TEMP}/clearcutt" "https://github.com/northcutted/clearcutt/releases/download/${VERSION}/clearcutt-linux-amd64"
          chmod +x "${RUNNER_TEMP}/clearcutt"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Check base compatibility
        run: |
          clearcutt app diff-base \
            --image "${{ inputs.image }}" \
            --candidate-base "${{ inputs.candidate-base }}" \
            --candidate-base-id java21-distroless \
            --fail-on-incompatible

      - name: Rebase, sign, and attest
        run: |
          clearcutt app rebase \
            --image "${{ inputs.image }}" \
            --candidate-base "${{ inputs.candidate-base }}" \
            --candidate-base-id java21-distroless \
            --tag "${{ inputs.tag }}" \
            --dev-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
            --sign \
            --attest
