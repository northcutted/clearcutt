# Dependency updates for the CLI's Go modules and the GitHub Actions the
# workflows and action.yml use. Action references are pinned to commit SHAs
# (enforced by scripts/validate-workflow-hardening.sh); dependabot moves the
# pins and keeps their trailing version comments current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
