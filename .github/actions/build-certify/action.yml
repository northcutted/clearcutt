# ClearCutt Reusable Composite Build & Certify Action
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Reusable CI/CD building block for secure zero-CVE application delivery

name: 'ClearCutt Build & Certify'
description: 'Declaratively compiles OCI layered images, generates SPDX SBOMs, executes security scans, and keylessly signs/attests images using the unified pipeline script'

inputs:
  language:
    description: 'Target matrix language (e.g. java21, python3.13, go1.25)'
    required: true
  tier:
    description: 'Target lifecycle tier (dev, slim, distroless)'
    required: true
    default: 'distroless'
  image-name:
    description: 'Target OCI registry destination image tag (e.g. ghcr.io/owner/repo:latest)'
    required: true

runs:
  using: "composite"
  steps:
    # 1. Setup Nix environment with active flakes support
    - name: Install Nix
      uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          allow-import-from-derivation = true

    # 2. Setup Deterministic Systems Magic Nix Cache for instant rebuild caching
    - name: Setup Magic Nix Cache
      uses: determinateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

    # 3. Setup Sigstore Cosign binaries natively
    - name: Install Sigstore Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # 4. Delegate all compilation, scanning, signing, and attestation to our unified pipeline
    - name: Run Unified Gating and Release Pipeline
      shell: bash
      run: |
        IMAGE_REF="${{ inputs.image-name }}"
        REGISTRY=$(echo "$IMAGE_REF" | cut -d'/' -f1)
        REPO_TAG=$(echo "$IMAGE_REF" | cut -d'/' -f2-)
        REPO=$(echo "$REPO_TAG" | cut -d':' -f1)

        nix develop --extra-experimental-features "nix-command flakes" --command ./pipeline/pipeline.sh \
          --publish \
          --registry "$REGISTRY" \
          --repo "$REPO" \
          "${{ inputs.language }}-${{ inputs.tier }}"

    # 5. Confirm certification completion
    - name: Confirm Image Gated and Attested
      shell: bash
      run: |
        echo -e "\033[1;32m[ClearCutt GHA] ✔ OCI Target successfully certified, signed, and published: ${{ inputs.image-name }}\033[0m"
