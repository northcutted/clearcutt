# ClearCutt Composite Action — Install Nix with baseline client config
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Install the Nix client; the ClearCutt CLI owns fork-specific config

name: 'ClearCutt Setup Nix'
description: 'Install Nix with flakes enabled; clearcutt platform setup-nix applies fork-specific fleet cache config'

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        # Keep this generic for forks. clearcutt platform setup-nix reads
        # clearcutt.fleet.yaml and exports the fork-specific NIX_CONFIG.
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          allow-import-from-derivation = true
          substituters = https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          connect-timeout = 5
          download-attempts = 3
