name: Feature request
description: Suggest an improvement to ClearCutt.
labels: ["enhancement"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Which part of the repo would this change?
      options:
        - core (Nix image factory)
        - cli (Go CLI)
        - site (Astro portal)
        - docs
        - workflows (.github)
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that ClearCutt makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketch the command, workflow, or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches you ruled out.
    validations:
      required: false
