# ClearCutt Hardened Fleets Prep Release Workflow
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Automatic Release Gating & Draft Aggregation on Push to Main

name: ClearCutt Prep Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Required to push the release notes branch and file
  pull-requests: write # Required to create the draft pull request

jobs:
  prepare-release-pr:
    name: Prepare Draft Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Fetches all history and tags to determine next semantic version

      - name: Calculate Next Version
        id: versioning
        uses: paulhatch/semantic-version@8da30f99b5b2e7a26ced60b1dad2e41756d6edf4 # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Process Staging Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NEXT_VERSION="${{ steps.versioning.outputs.version }}"
          BUMPED="${{ steps.versioning.outputs.bumped }}"
          NEXT_TAG="v$NEXT_VERSION"

          if [ "$BUMPED" != "true" ]; then
            echo "No semantic version bump detected (no new feat, fix, or BREAKING CHANGE commits since last tag). Skipping release prep."
            exit 0
          fi

          echo "Determined next version bump: $NEXT_TAG"

          # 1. Check if a release draft PR already exists for this branch/version
          BRANCH_NAME="release/$NEXT_TAG"
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "A Draft Pull Request for $NEXT_TAG already exists (PR #$EXISTING_PR). Skipping duplicate creation."
            exit 0
          fi

          # 2. Generate release notes from GitHub REST API
          echo "Generating automated release notes via GitHub API..."
          BODY=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$NEXT_TAG" -f target_commitish="main" --jq '.body')

          # 3. Create release notes directory and write file
          mkdir -p docs/releases
          NOTES_PATH="docs/releases/$NEXT_TAG.md"
          
          cat <<EOF > "$NOTES_PATH"
          # 📋 ClearCutt Hardened Fleet Staging Notes - $NEXT_TAG

          This staging notes document was automatically compiled for release **$NEXT_TAG**.

          ---

          $BODY
          EOF

          # 4. Commit and push the staging notes to the release prep branch
          echo "Committing release notes to branch $BRANCH_NAME..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add "$NOTES_PATH"
          git commit -m "chore: prepare release notes for $NEXT_TAG"
          git push origin "$BRANCH_NAME" --force

          # 5. Create the beautiful draft Pull Request
          echo "Opening draft Pull Request for release review..."
          gh pr create --draft \
            --title "🚀 Release Prep: $NEXT_TAG" \
            --body "This Draft Pull Request has been automatically created to prepare the upcoming release **$NEXT_TAG**.

            ## 📝 Release Notes
            The automated release notes have been committed directly to the branch and can be reviewed in [docs/releases/$NEXT_TAG.md](file:///absolute/path/to/repo/docs/releases/$NEXT_TAG.md).

            ## ⚙️ How to Publish this Release
            Once all changes are reviewed and approved, you can publish the official release:
            1. (Optional) Merge this PR to bring the release notes file into \`main\`.
            2. Go to the **GitHub Actions** tab in your repository.
            3. Run the **ClearCutt Release Trigger** manual workflow.
            
            The manual workflow will automatically tag the release, triggering the unified cryptographic compilation, keyless OIDC signing, SPDX SBOM attestations, SLSA Level 3 provenance, and publication to GHCR." \
            --head "$BRANCH_NAME" \
            --base main
          
          echo "Staging gate completed successfully. Draft PR created."
