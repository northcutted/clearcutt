# ClearCutt Hardened Fleets Prep Release Workflow
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Automatic Release Gating & Draft Aggregation on Push to Main

name: ClearCutt Prep Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # CRITICAL: Required to create draft releases and attach assets
  packages: read
  statuses: write

jobs:
  validate-and-gate:
    name: Build & Gate (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        system: [
          "x86_64-linux",
          "aarch64-linux"
        ]
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "node24",
          "python3.13",
          "python3.14",
          "go1.25",
          "go1.26",
          "dotnet8",
          "dotnet10"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/flake.lock') }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run Build and Security Gate
        run: |
          nix develop --extra-experimental-features "nix-command flakes" --command ./pipeline/pipeline.sh \
            --system "${{ matrix.system }}" \
            "${{ matrix.language }}-${{ matrix.tier }}"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json
          retention-days: 7

  draft-release:
    name: Compile Draft Release
    needs: validate-and-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # CRITICAL: Fetches all history and tags to determine next semantic version

      - name: Calculate Next Version
        id: versioning
        uses: paulhatch/semantic-version@8da30f99b5b2e7a26ced60b1dad2e41756d6edf4 # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      # Download all SBOMs generated across the matrix jobs into build-outputs/
      - name: Download all SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-outputs/
          pattern: sbom-*
          merge-multiple: true

      # Create draft release and upload aggregated SBOMs
      - name: Create and Populate Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_TAG="v${{ steps.versioning.outputs.version }}"
          echo "Determined next version: $NEXT_TAG"

          echo "Checking for any old stale draft releases for $NEXT_TAG..."
          gh release delete "$NEXT_TAG" --yes 2>/dev/null || true

          echo "Compiling and drafting Release $NEXT_TAG..."
          gh release create "$NEXT_TAG" \
            --draft \
            --title "Release $NEXT_TAG (Staging Prep)" \
            --generate-notes \
            --notes "This draft release represents a staging container and is prepped for official release. All OCI matrix images have been compiled, gated, and scanned through Syft and Grype with zero CVEs. 
            
            To release these assets:
            Simply click 'Publish Release'. This will trigger the final publication to GHCR with Sigstore signatures and SLSA provenance." \
            --target main

          echo "Uploading compiled SPDX SBOM assets to the draft release..."
          gh release upload "$NEXT_TAG" build-outputs/*.sbom.json --clobber
