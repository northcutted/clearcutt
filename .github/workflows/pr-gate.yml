# ClearCutt Hardened Fleets Pull Request Gating Workflow
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Hermetic Build, SBOM Generation, & CVE Scan Gating (No Registry Access)

name: ClearCutt PR Gating

on:
  pull_request:
    branches:
      - main
    # Skip the 78-cell matrix for PRs that can't affect build output.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write # Allows the ClearCutt build gate to report pass/fail status back to the SCM

# Cancel superseded PR runs — the latest push is the only one anyone cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-matrix:
    name: Validate Matrix (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        system: [
          "x86_64-linux",
          "aarch64-linux"
        ]
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "node24",
          "python3.13",
          "python3.14",
          "go1.25",
          "go1.26",
          "dotnet8",
          "dotnet10",
          "rust1.95",
          "cc15"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('core/flake.lock', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Build, generate SBOM, and scan with Syft + Grype locally.
      # Omit --publish to prevent any registry copy or keyless OIDC signing.
      - name: Run Build and Security Gate
        run: |
          ./clearcutt fleet certify-target \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

      # Upload the validated SBOM JSON as an artifact for audit checking
      - name: Upload Local SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-pr-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json
          retention-days: 7

  integration-checks:
    name: Run Verification Gating Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-integration-${{ runner.os }}-${{ hashFiles('core/flake.lock', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-integration-${{ runner.os }}-

      # Required for structure tests and patchelf inside the suite
      - name: Install Cosign & Gating Tools
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Execute Gating Suite
        run: ./clearcutt platform setup-nix --core-dir core -- ./tests/verify.sh

  go-ci:
    name: Go Lint, Build, Test & Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Go Vet
        working-directory: cli
        run: go vet ./...

      - name: Go Build
        run: make cli-build

      - name: Dev Command Integration Smoke
        run: |
          dev_json="$(./clearcutt --catalog cli/internal/testdata/dev-catalog dev java21-distroless --devcontainer --print)"
          printf '%s\n' "$dev_json" | jq -e '
            .name == "ClearCutt java21-dev" and
            .workspaceFolder == "/app" and
            .remoteUser == "10001" and
            .containerEnv.CLEARCUTT_IMAGE_ID == "java21-dev" and
            .containerEnv.CLEARCUTT_IMAGE_TAG == "v1.2.3" and
            .image == "ghcr.io/acme/clearcutt/clearcutt-java21:v1.2.3-dev@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ' >/dev/null

          fallback_json="$(./clearcutt --catalog "$RUNNER_TEMP/missing-clearcutt-catalog" dev java21-distroless --tag v0.2.1 --devcontainer --print)"
          printf '%s\n' "$fallback_json" | jq -e '
            .containerEnv.CLEARCUTT_IMAGE_ID == "java21-dev" and
            .containerEnv.CLEARCUTT_IMAGE_TAG == "v0.2.1" and
            .image == "ghcr.io/northcutted/clearcutt/clearcutt-java21:v0.2.1-dev"
          ' >/dev/null
          echo "Dev command integration smoke PASSED!"

      - name: Go Test with Coverage
        working-directory: cli
        env:
          COVERAGE_MIN: "85.0"
        run: ./scripts/go-coverage.sh

      - name: Upload Go Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            cli/coverage.out
            cli/coverage.txt
            cli/coverage-packages.txt
            cli/coverage-low-functions.txt
            cli/coverage.html
          retention-days: 14
          if-no-files-found: error

      - name: Run Schema Drift Guard
        run: |
          # Verify every catalog JSON compiles strictly against the Go data models
          # with zero unmapped/unknown fields.
          fixture_catalog="cli/internal/testdata/catalog"
          mapfile -t images < <(python3 -c 'import json, sys; catalog = json.load(open(sys.argv[1], encoding="utf-8")); print("\n".join(image["id"] for image in catalog.get("images", [])))' "$fixture_catalog/index.json")
          for img in "${images[@]}"; do
            echo "Checking strict catalog drift for $img..."
            ./clearcutt --catalog "$fixture_catalog" inspect "$img" --strict >/dev/null
          done
          echo "Drift guard check PASSED!"
