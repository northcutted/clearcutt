# ClearCutt Hardened Fleets Pull Request Gating Workflow

name: ClearCutt PR Gating

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write # Allows the ClearCutt build gate to report pass/fail status back to the SCM

# Cancel superseded PR runs — the latest push is the only one anyone cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Surfaces
    runs-on: ubuntu-latest
    outputs:
      fleet: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.fleet }}
      service: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.service }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site }}
      integration: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.integration }}
      go: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.go }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Classify changed paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            fleet:
              - 'clearcutt.yaml'
              - 'schemas/**'
              - '.github/actions/setup-nix/action.yml'
              - '.github/workflows/pr-gate.yml'
              - 'cli/cmd/**'
              - 'cli/go.*'
              - 'cli/internal/commands/fleet*.go'
              - 'cli/internal/commands/matrix*.go'
              - 'cli/internal/commands/platform*.go'
              - 'cli/internal/fleet/**'
            service:
              - 'clearcutt.yaml'
              - 'schemas/**'
              - 'examples/service-images/**'
              - '.github/actions/setup-nix/action.yml'
              - '.github/workflows/pr-gate.yml'
              - 'cli/cmd/**'
              - 'cli/go.*'
              - 'cli/internal/catalogbuild/**'
              - 'cli/internal/commands/service*.go'
              - 'cli/internal/commands/catalog_*.go'
              - 'cli/internal/fleet/**'
            site:
              - 'site/**'
              - 'cli/internal/sitetemplate/**'
              - 'cli/internal/testdata/**'
              - 'cli/internal/commands/catalog_site.go'
              - 'docs/site-generator.md'
              - '.github/workflows/pr-gate.yml'
            integration:
              - 'cli/**'
              - 'clearcutt.yaml'
              - 'schemas/**'
              - 'Makefile'
              - '.github/actions/setup-nix/action.yml'
              - '.github/workflows/pr-gate.yml'
            go:
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'cli/**'
              - '.agents/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - '.github/copilot-instructions.md'

  site-ci:
    name: Catalog Site Service Fixture
    needs: [changes]
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Validate Mixed Runtime and Service Catalog
        run: |
          ./clearcutt --catalog cli/internal/testdata/mixed-catalog catalog validate --schema-version clearcutt.catalog.index/v2
          ./clearcutt --catalog cli/internal/testdata/mixed-catalog catalog validate --schema-version clearcutt.catalog.image/v2

      - name: Build Catalog Site From Mixed Fixture
        run: |
          ./clearcutt catalog site build --catalog cli/internal/testdata/mixed-catalog --template site --output "$RUNNER_TEMP/service-site" --install
          service_page="$RUNNER_TEMP/service-site/images/postgres16/index.html"
          catalog_page="$RUNNER_TEMP/service-site/catalog/index.html"
          test -f "$service_page"
          test -f "$catalog_page"
          grep -q "Service Images" "$catalog_page"
          grep -q "Service Image Usage" "$service_page"
          grep -q "postgres:5432/tcp" "$service_page"
          grep -q "/var/lib/postgresql/data" "$service_page"
          grep -q "Non-Prod Only" "$service_page"
          grep -q "docker-compose.yml" "$service_page"
          grep -q "pod.yaml" "$service_page"
          if grep -q "Base Image Layering" "$service_page" || grep -q "Nix Shell" "$service_page" || grep -q "Runtime Security" "$service_page"; then
            echo "service page still renders runtime-first copy" >&2
            exit 1
          fi

  integration-checks:
    name: Run Verification Gating Suite
    needs: [changes]
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    # See validate-matrix: this still runs the broad local gate, but should not
    # need a world-rebuild budget for CVE overlay changes.
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-pr-${{ github.event.pull_request.number || github.ref_name }}-integration-${{ runner.os }}-${{ hashFiles('cli/go.sum') }}
          restore-prefixes-first-match: |
            nix-pr-${{ github.event.pull_request.number || github.ref_name }}-integration-${{ runner.os }}-
            nix-integration-${{ runner.os }}-

  go-ci:
    name: Go Lint, Build, Test & Drift Guard
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Go Vet
        working-directory: cli
        run: go vet ./...

      - name: Go Build
        run: make cli-build

      - name: Imported Fleet Offline Demo
        run: CLEARCUTT="$PWD/clearcutt" ./scripts/demo-imported-fleet-offline.sh

      - name: Validate Documented Commands
        run: ./scripts/validate-doc-commands.sh ./clearcutt

      - name: Validate Workflow Hardening
        run: ./scripts/validate-workflow-hardening.sh

      - name: Dev Command Integration Smoke
        run: |
          dev_json="$(./clearcutt --catalog cli/internal/testdata/dev-catalog dev java21-distroless --devcontainer --print)"
          printf '%s\n' "$dev_json" | jq -e '
            .name == "ClearCutt java21-dev" and
            .workspaceFolder == "/app" and
            .remoteUser == "10001" and
            .containerEnv.CLEARCUTT_IMAGE_ID == "java21-dev" and
            .containerEnv.CLEARCUTT_IMAGE_TAG == "v1.2.3" and
            .image == "ghcr.io/acme/clearcutt/clearcutt-java21:v1.2.3-dev@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ' >/dev/null

          fallback_json="$(./clearcutt --catalog "$RUNNER_TEMP/missing-clearcutt-catalog" dev java21-distroless --tag v0.2.1 --devcontainer --print)"
          printf '%s\n' "$fallback_json" | jq -e '
            .containerEnv.CLEARCUTT_IMAGE_ID == "java21-dev" and
            .containerEnv.CLEARCUTT_IMAGE_TAG == "v0.2.1" and
            .image == "ghcr.io/northcutted/clearcutt/clearcutt-java21:v0.2.1-dev"
          ' >/dev/null
          echo "Dev command integration smoke PASSED!"

      - name: Go Test with Coverage
        working-directory: cli
        env:
          COVERAGE_MIN: "85.0"
        run: ./scripts/go-coverage.sh

      - name: Upload Go Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            cli/coverage.out
            cli/coverage.txt
            cli/coverage-packages.txt
            cli/coverage-low-functions.txt
            cli/coverage.html
          retention-days: 14
          if-no-files-found: error

      - name: Run Schema Drift Guard
        run: |
          # Verify every catalog JSON compiles strictly against the Go data models
          # with zero unmapped/unknown fields.
          for fixture_catalog in cli/internal/testdata/catalog cli/internal/testdata/mixed-catalog; do
            mapfile -t images < <(python3 -c 'import json, sys; catalog = json.load(open(sys.argv[1], encoding="utf-8")); print("\n".join(image["id"] for image in catalog.get("images", [])))' "$fixture_catalog/index.json")
            for img in "${images[@]}"; do
              echo "Checking strict catalog drift for $fixture_catalog/$img..."
              ./clearcutt --catalog "$fixture_catalog" inspect "$img" --strict >/dev/null
            done
          done
          echo "Drift guard check PASSED!"

  pr-gate-summary:
    name: PR Gate Summary
    needs:
      - changes
      - site-ci
      - integration-checks
      - go-ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required gate jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr-gate-summary.py" <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          changes = needs.get("changes", {})
          outputs = changes.get("outputs") or {}

          def enabled(name):
              return str(outputs.get(name, "")).lower() == "true"

          selected = {
              "site-ci": enabled("site"),
              "integration-checks": enabled("integration"),
              "go-ci": enabled("go"),
          }

          lines = [
              "# PR Gate Summary",
              "",
              "## Path Filters",
              "",
              "| Surface | Selected |",
              "| --- | --- |",
          ]
          for name in ["fleet", "service", "site", "integration", "go"]:
              lines.append(f"| `{name}` | `{enabled(name)}` |")

          lines.extend([
              "",
              "## Job Results",
              "",
              "| Job | Expected | Result |",
              "| --- | --- | --- |",
          ])

          failures = []
          changes_result = changes.get("result")
          lines.append(f"| `changes` | `success` | `{changes_result}` |")
          if changes_result != "success":
              failures.append(f"changes={changes_result}")

          # Drift guard, both directions. A contract entry with no `needs` entry
          # means the job was deleted or renamed and the contract was not
          # updated; a `needs` job absent from the contract runs unchecked.
          for name in selected:
              if name not in needs:
                  failures.append(f"{name} is in the contract but not in `needs` (deleted or renamed job?)")
          for name in needs:
              if name != "changes" and name not in selected:
                  failures.append(f"{name} is in `needs` but not in the contract (its result is unchecked)")

          for name, is_selected in selected.items():
              if name not in needs:
                  continue
              result = (needs.get(name) or {}).get("result")
              expected = "success" if is_selected else "skipped"
              lines.append(f"| `{name}` | `{expected}` | `{result}` |")
              if is_selected and result != "success":
                  failures.append(f"{name}={result} (selected)")
              elif not is_selected and result in {"failure", "cancelled"}:
                  failures.append(f"{name}={result} (not selected)")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))

          if failures:
              print("Required PR gate contract failed:", ", ".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
          python3 "$RUNNER_TEMP/pr-gate-summary.py"
