# ClearCutt Hardened Fleets Pull Request Gating Workflow

name: ClearCutt PR Gating

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write # Allows the ClearCutt build gate to report pass/fail status back to the SCM

# Cancel superseded PR runs — the latest push is the only one anyone cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Surfaces
    runs-on: ubuntu-latest
    outputs:
      fleet: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.fleet }}
      service: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.service }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site }}
      integration: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.integration }}
      go: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.go }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Classify changed paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            fleet:
              - 'core/**'
              - 'clearcutt.fleet.yaml'
              - 'schemas/**'
              - '.github/actions/setup-nix/action.yml'
              - '.github/workflows/pr-gate.yml'
              - 'cli/cmd/**'
              - 'cli/go.*'
              - 'cli/internal/commands/fleet*.go'
              - 'cli/internal/commands/matrix*.go'
              - 'cli/internal/commands/platform*.go'
              - 'cli/internal/fleet/**'
            service:
              - 'core/**'
              - 'clearcutt.fleet.yaml'
              - 'schemas/**'
              - 'examples/service-images/**'
              - '.github/actions/setup-nix/action.yml'
              - '.github/workflows/pr-gate.yml'
              - 'cli/cmd/**'
              - 'cli/go.*'
              - 'cli/internal/catalogbuild/**'
              - 'cli/internal/commands/service*.go'
              - 'cli/internal/commands/catalog_*.go'
              - 'cli/internal/fleet/**'
            site:
              - 'site/**'
              - 'cli/internal/sitetemplate/**'
              - 'cli/internal/testdata/**'
              - 'cli/internal/commands/catalog_site.go'
              - 'docs/site-generator.md'
              - '.github/workflows/pr-gate.yml'
            integration:
              - 'core/**'
              - 'cli/**'
              - 'clearcutt.fleet.yaml'
              - 'schemas/**'
              - 'Makefile'
              - '.github/actions/setup-nix/action.yml'
              - '.github/workflows/pr-gate.yml'
              - '.github/workflows/e2e-runtimes.yml'
            go:
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'cli/**'
              - '.agents/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - '.github/copilot-instructions.md'

  fleet-matrix:
    name: Resolve Fleet Matrix
    needs: [changes]
    if: ${{ needs.changes.outputs.fleet == 'true' || needs.changes.outputs.service == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.matrix.outputs.release_matrix }}
      service_release_matrix: ${{ steps.matrix.outputs.service_release_matrix }}
      service_image_matrix: ${{ steps.matrix.outputs.service_image_matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Export fleet matrix
        id: matrix
        run: ./clearcutt fleet workflow-matrices --github-output "$GITHUB_OUTPUT"

  validate-matrix:
    name: Validate Matrix (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    needs: [changes, fleet-matrix]
    if: ${{ needs.changes.outputs.fleet == 'true' }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Runtime-scoped CVE patching keeps shared build tooling on upstream
    # caches. Keep enough room for runtime-specific source builds without
    # treating every overlay bump as a full toolchain rebuild.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.release_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Fleet image derivations are shaped by flake inputs, lib helpers,
          # registry/service metadata, and CVE overlays. Keep cache keys broad
          # enough that package graph changes do not restore stale prefixes.
          # The key is per matrix leg: with a shared key only the FIRST
          # successful job saves, so every other leg's runtime stack (java,
          # node, python...) would rebuild cold on every run whenever the CVE
          # overlays diverge from upstream binary caches.
          primary-key: nix-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}-${{ hashFiles('core/flake.lock', 'core/lib/**', 'core/overlays/**') }}
          restore-prefixes-first-match: |
            nix-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}-
            nix-${{ matrix.system }}-

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Build, generate SBOM, and scan with Syft + Grype locally.
      # Omit --publish to prevent any registry copy or keyless OIDC signing.
      - name: Run Build and Security Gate
        env:
          CLEARCUTT_BUILD_ENGINE: ${{ vars.CLEARCUTT_BUILD_ENGINE || 'go' }}
        run: |
          ./clearcutt fleet certify-target \
            --engine "${CLEARCUTT_BUILD_ENGINE}" \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

      # Upload local evidence even when a gate fails so reviewers can inspect
      # the exact SBOM, Grype findings, and structured predicate.
      - name: Upload Local Evidence Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-pr-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: |
            core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json
            core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}.grype.json
            core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}.test-results.json
          if-no-files-found: ignore
          retention-days: 7

  validate-service-images:
    name: Validate Service Image (${{ matrix.service }})
    needs: [changes, fleet-matrix]
    if: ${{ needs.changes.outputs.service == 'true' }}
    runs-on: ubuntu-latest
    # See validate-matrix: runtime-scoped patches should not rebuild the shared
    # toolchain, but service packages can still be substantial.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.service_image_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Service image closures also depend on shared lib/build helpers, not
          # just service-extensions.nix. Per-service key for the same reason as
          # validate-matrix: a shared key is only saved by the first success.
          primary-key: nix-service-x86_64-linux-${{ matrix.service }}-${{ hashFiles('core/flake.lock', 'core/lib/**', 'core/overlays/**') }}
          restore-prefixes-first-match: |
            nix-service-x86_64-linux-${{ matrix.service }}-
            nix-service-x86_64-linux-

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate Service Config and Nix Attr
        run: ./clearcutt service validate "${{ matrix.service }}" --nix --system x86_64-linux --core-dir core

      - name: Build Service Image
        env:
          CLEARCUTT_BUILD_ENGINE: ${{ vars.CLEARCUTT_BUILD_ENGINE || 'go' }}
        run: ./clearcutt service build "${{ matrix.service }}" --engine "${CLEARCUTT_BUILD_ENGINE}" --system x86_64-linux --core-dir core

      - name: Validate Service OCI Contract and Smoke
        env:
          CLEARCUTT_CLI: ./clearcutt
        run: core/tests/service-image-contract.sh "${{ matrix.service }}" "core/build-outputs/${{ matrix.service }}.tar.gz"

      - name: Upload Service SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-pr-x86_64-linux-${{ matrix.service }}-service
          path: |
            core/build-outputs/${{ matrix.service }}.sbom.json
            core/build-outputs/${{ matrix.service }}.test-results.json
          retention-days: 7

  site-ci:
    name: Catalog Site Service Fixture
    needs: [changes]
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Validate Mixed Runtime and Service Catalog
        run: |
          ./clearcutt --catalog cli/internal/testdata/mixed-catalog catalog validate --schema-version clearcutt.catalog.index/v2
          ./clearcutt --catalog cli/internal/testdata/mixed-catalog catalog validate --schema-version clearcutt.catalog.image/v2

      - name: Build Catalog Site From Mixed Fixture
        run: |
          ./clearcutt catalog site build --catalog cli/internal/testdata/mixed-catalog --template site --output "$RUNNER_TEMP/service-site" --install
          service_page="$RUNNER_TEMP/service-site/images/postgres16/index.html"
          catalog_page="$RUNNER_TEMP/service-site/catalog/index.html"
          test -f "$service_page"
          test -f "$catalog_page"
          grep -q "Service Images" "$catalog_page"
          grep -q "Service Image Usage" "$service_page"
          grep -q "postgres:5432/tcp" "$service_page"
          grep -q "/var/lib/postgresql/data" "$service_page"
          grep -q "Non-Prod Only" "$service_page"
          grep -q "docker-compose.yml" "$service_page"
          grep -q "pod.yaml" "$service_page"
          if grep -q "Base Image Layering" "$service_page" || grep -q "Nix Shell" "$service_page" || grep -q "Runtime Security" "$service_page"; then
            echo "service page still renders runtime-first copy" >&2
            exit 1
          fi

  integration-checks:
    name: Run Verification Gating Suite
    needs: [changes]
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    # See validate-matrix: this still runs the broad local gate, but should not
    # need a world-rebuild budget for CVE overlay changes.
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Validate Remediation Overlay Governance
        run: ./clearcutt remediation validate-overlays --overlay-dir core/overlays/cve

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-integration-${{ runner.os }}-${{ hashFiles('core/flake.lock', 'core/lib/**', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-integration-${{ runner.os }}-

      - name: Execute Gating Suite
        run: ./clearcutt verify boundary-suite --core-dir core

  go-ci:
    name: Go Lint, Build, Test & Drift Guard
    needs: [changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Go Vet
        working-directory: cli
        run: go vet ./...

      - name: Go Build
        run: make cli-build

      - name: Validate Documented Commands
        run: ./scripts/validate-doc-commands.sh ./clearcutt

      - name: Validate Workflow Hardening
        run: ./scripts/validate-workflow-hardening.sh

      - name: Dev Command Integration Smoke
        run: |
          dev_json="$(./clearcutt --catalog cli/internal/testdata/dev-catalog dev java21-distroless --devcontainer --print)"
          printf '%s\n' "$dev_json" | jq -e '
            .name == "ClearCutt java21-dev" and
            .workspaceFolder == "/app" and
            .remoteUser == "10001" and
            .containerEnv.CLEARCUTT_IMAGE_ID == "java21-dev" and
            .containerEnv.CLEARCUTT_IMAGE_TAG == "v1.2.3" and
            .image == "ghcr.io/acme/clearcutt/clearcutt-java21:v1.2.3-dev@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ' >/dev/null

          fallback_json="$(./clearcutt --catalog "$RUNNER_TEMP/missing-clearcutt-catalog" dev java21-distroless --tag v0.2.1 --devcontainer --print)"
          printf '%s\n' "$fallback_json" | jq -e '
            .containerEnv.CLEARCUTT_IMAGE_ID == "java21-dev" and
            .containerEnv.CLEARCUTT_IMAGE_TAG == "v0.2.1" and
            .image == "ghcr.io/northcutted/clearcutt/clearcutt-java21:v0.2.1-dev"
          ' >/dev/null
          echo "Dev command integration smoke PASSED!"

      - name: Go Test with Coverage
        working-directory: cli
        env:
          COVERAGE_MIN: "85.0"
        run: ./scripts/go-coverage.sh

      - name: Upload Go Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: |
            cli/coverage.out
            cli/coverage.txt
            cli/coverage-packages.txt
            cli/coverage-low-functions.txt
            cli/coverage.html
          retention-days: 14
          if-no-files-found: error

      - name: Run Schema Drift Guard
        run: |
          # Verify every catalog JSON compiles strictly against the Go data models
          # with zero unmapped/unknown fields.
          for fixture_catalog in cli/internal/testdata/catalog cli/internal/testdata/mixed-catalog; do
            mapfile -t images < <(python3 -c 'import json, sys; catalog = json.load(open(sys.argv[1], encoding="utf-8")); print("\n".join(image["id"] for image in catalog.get("images", [])))' "$fixture_catalog/index.json")
            for img in "${images[@]}"; do
              echo "Checking strict catalog drift for $fixture_catalog/$img..."
              ./clearcutt --catalog "$fixture_catalog" inspect "$img" --strict >/dev/null
            done
          done
          echo "Drift guard check PASSED!"

  e2e-runtimes:
    name: E2E Runtimes
    needs: [changes]
    # The heavy lifecycle suite shares the integration surface (core/cli/fleet
    # config); it ran as a standalone pull_request workflow before being
    # folded into this gate so PRs surface one workflow.
    if: ${{ needs.changes.outputs.integration == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-runtimes.yml

  pr-gate-summary:
    name: PR Gate Summary
    needs:
      - changes
      - fleet-matrix
      - validate-matrix
      - validate-service-images
      - site-ci
      - integration-checks
      - go-ci
      - e2e-runtimes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required gate jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pr-gate-summary.py" <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          changes = needs.get("changes", {})
          outputs = changes.get("outputs") or {}

          def enabled(name):
              return str(outputs.get(name, "")).lower() == "true"

          selected = {
              "fleet-matrix": enabled("fleet") or enabled("service"),
              "validate-matrix": enabled("fleet"),
              "validate-service-images": enabled("service"),
              "site-ci": enabled("site"),
              "integration-checks": enabled("integration"),
              "go-ci": enabled("go"),
              "e2e-runtimes": enabled("integration"),
          }

          lines = [
              "# PR Gate Summary",
              "",
              "## Path Filters",
              "",
              "| Surface | Selected |",
              "| --- | --- |",
          ]
          for name in ["fleet", "service", "site", "integration", "go"]:
              lines.append(f"| `{name}` | `{enabled(name)}` |")

          lines.extend([
              "",
              "## Job Results",
              "",
              "| Job | Expected | Result |",
              "| --- | --- | --- |",
          ])

          failures = []
          changes_result = changes.get("result")
          lines.append(f"| `changes` | `success` | `{changes_result}` |")
          if changes_result != "success":
              failures.append(f"changes={changes_result}")

          for name, is_selected in selected.items():
              result = (needs.get(name) or {}).get("result")
              expected = "success" if is_selected else "skipped"
              lines.append(f"| `{name}` | `{expected}` | `{result}` |")
              if is_selected and result != "success":
                  failures.append(f"{name}={result} (selected)")
              elif not is_selected and result in {"failure", "cancelled"}:
                  failures.append(f"{name}={result} (not selected)")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))

          if failures:
              print("Required PR gate contract failed:", ", ".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
          python3 "$RUNNER_TEMP/pr-gate-summary.py"
