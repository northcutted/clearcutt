# Build and deploy the ClearCutt catalog site to GitHub Pages.

name: ClearCutt Catalog Site

on:
  workflow_dispatch:
    inputs:
      release_limit:
        description: "How many recent releases to ingest"
        required: false
        default: "10"
      force_refresh_all:
        description: "Ignore the cache and re-fetch enrichment + SBOMs for every release (slow; use when schema changes or attestations are re-attached)"
        required: false
        default: "false"
        type: boolean
  # Rebuild nightly so CVE / vulnerability data stays fresh as the Grype DB
  # picks up newly-disclosed advisories against pinned package versions in
  # the SBOMs. 06:00 UTC keeps it off the GHA peak hours.
  schedule:
    - cron: "0 6 * * *"
  workflow_call:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gather:
    name: Gather catalog data
    runs-on: ubuntu-latest
    outputs:
      release-limit: ${{ steps.params.outputs.limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so `git describe --tags` resolves the release tag the
          # generator version is stamped from.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          VERSION="$(git describe --tags --always)"
          cd cli
          go build \
            -ldflags="-s -w -X github.com/northcutted/clearcutt/internal/commands.Version=${VERSION}" \
            -o ../clearcutt ./cmd/clearcutt

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v3 so catalog enrichment reads the same bundle format
          # produced by the release workflow.
          cosign-release: 'v3.0.6'

      - name: Install grype
        run: |
          set -euo pipefail
          GRYPE_VERSION=0.114.0
          GRYPE_TARBALL="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          GRYPE_SHA256="edda0968d8827daab01d32b3cd7de192ae0915005e7bbfcfef9e68e79bc43343"
          curl -fsSL -o "/tmp/${GRYPE_TARBALL}" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${GRYPE_TARBALL}"
          printf '%s  %s\n' "${GRYPE_SHA256}" "/tmp/${GRYPE_TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${GRYPE_TARBALL}" -C /usr/local/bin grype
          cosign version
          grype version

      - name: Refresh grype DB
        run: grype db update

      - name: Authenticate registry client
        env:
          REGISTRY_HOST: ${{ vars.CLEARCUTT_REGISTRY_HOST || 'ghcr.io' }}
          REGISTRY_USER: ${{ vars.CLEARCUTT_REGISTRY_USER || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.CLEARCUTT_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

      # Cache the per-release enrichment, SBOM downloads, and vulnerability
      # scan output. Old releases are immutable: once an image is published, its
      # manifest digests, layers, OCI labels, and cosign attestations never
      # change. The catalog gather + enrich commands refresh only the most recent tag
      # (controlled via FORCE_REFRESH_* env vars) and read everything older
      # straight off disk. Vulnerability JSON is cached so the scanner can
      # refresh a bounded recent window while preserving older catalog data.
      #
      # Cache key scheme: the run_id makes each saved entry immutable (GH
      # Actions cache keys can't be overwritten); restore-keys do a prefix
      # match so the most recent prior cache is restored. The script hash in
      # the prefix busts the cache on any data-layer schema change.
      - name: Restore catalog data cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
            site/src/data/vulnerabilities
          key: catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/oci/*.go', 'cli/internal/sign/*.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/oci/*.go', 'cli/internal/sign/*.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      - name: Resolve fleet catalog parameters
        id: params
        env:
          # Hoisted out of the run script so the GitHub templater never
          # expands untrusted dispatch inputs into shell code.
          INPUT_LIMIT: ${{ github.event.inputs.release_limit || '' }}
        run: |
          set -euo pipefail
          FLEET=$(./clearcutt --format json matrix export --source fleet)
          DEFAULT_LIMIT=$(jq -r '.catalog.releaseLimit' <<< "$FLEET")
          SCAN_DEPTH=$(jq -r '.catalog.scanDepth' <<< "$FLEET")
          if [[ -n "$INPUT_LIMIT" ]]; then
            echo "limit=${INPUT_LIMIT}" >> "$GITHUB_OUTPUT"
          else
            echo "limit=${DEFAULT_LIMIT}" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_depth=${SCAN_DEPTH}" >> "$GITHUB_OUTPUT"

      - name: Build catalog data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: ${{ steps.params.outputs.limit }}
          FORCE_REFRESH_ALL: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
          SCAN_ALL_TAGS: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_REFRESH_ALL}" == "1" ]]; then
            ./clearcutt catalog build \
              --limit "$RELEASE_LIMIT" \
              --scan-depth "${{ steps.params.outputs.scan_depth }}" \
              --force-refresh-all \
              --scan-all \
              --include-services
          else
            ./clearcutt catalog build \
              --limit "$RELEASE_LIMIT" \
              --scan-depth "${{ steps.params.outputs.scan_depth }}" \
              --include-services
          fi

      # Schema-validate the generated catalog (structural checks plus the
      # embedded JSON Schemas) before it is uploaded for the site build.
      - name: Validate generated catalog
        run: ./clearcutt --catalog site/src/data/catalog catalog validate

      - name: Upload catalog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-data
          path: |
            site/src/data/catalog
            site/src/data/enrichment
            site/src/data/vulnerabilities
          retention-days: 7

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: gather
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so `git describe --tags` resolves the release tag the
          # generator version is stamped from.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download catalog data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-data
          path: site/src/data

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          VERSION="$(git describe --tags --always)"
          cd cli
          go build \
            -ldflags="-s -w -X github.com/northcutted/clearcutt/internal/commands.Version=${VERSION}" \
            -o ../clearcutt ./cmd/clearcutt

      - name: Generate OpenVEX documents
        run: |
          mkdir -p site/public/vex
          for id in $(jq -r '.images[].id' site/src/data/catalog/index.json | sort -u); do
            echo "Generating OpenVEX for ${id}..."
            ./clearcutt --catalog site/src/data/catalog vex "${id}" --output site/public/vex/"${id}".json
          done

      - name: Resolve Pages base path
        id: pages_base
        env:
          # Hoisted out of the run script so the GitHub templater never
          # expands event payload fields into shell code.
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "site=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
          echo "base=/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Astro
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages_base.outputs.site }}
          BASE_PATH: ${{ steps.pages_base.outputs.base }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
