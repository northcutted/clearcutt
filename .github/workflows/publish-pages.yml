# Build and deploy the ClearCutt catalog site to GitHub Pages.
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Dynamic catalog rebuilt from immutable GitHub Release assets and live GHCR metadata

name: ClearCutt Catalog Site

on:
  workflow_dispatch:
    inputs:
      release_limit:
        description: "How many recent releases to ingest"
        required: false
        default: "10"
      force_refresh_all:
        description: "Ignore the cache and re-fetch enrichment + SBOMs for every release (slow; use when schema changes or attestations are re-attached)"
        required: false
        default: "false"
        type: boolean
  # Rebuild nightly so CVE / vulnerability data stays fresh as the Grype DB
  # picks up newly-disclosed advisories against pinned package versions in
  # the SBOMs. 06:00 UTC keeps it off the GHA peak hours.
  schedule:
    - cron: "0 6 * * *"
  workflow_call:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gather:
    name: Gather catalog data
    runs-on: ubuntu-latest
    outputs:
      release-limit: ${{ steps.params.outputs.limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Install cosign and grype
        run: |
          set -euo pipefail
          # cosign binary pinned to match the release workflow's signer
          # (cosign-release in release.yml). The release signs OCI image indexes
          # with cosign v3's default new bundle format, so the Go catalog enricher
          # must read with the same major to resolve those attestations; pinning
          # avoids writer/reader format drift.
          COSIGN_VERSION=v3.0.6
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /tmp/cosign && sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version
          # grype via official install script
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype version

      - name: Refresh grype DB
        run: grype db update

      - name: Authenticate registry client to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Cache the per-release enrichment, SBOM downloads, and vulnerability
      # scan output. Old releases are immutable: once an image is published, its
      # manifest digests, layers, OCI labels, and cosign attestations never
      # change. The catalog gather + enrich commands refresh only the most recent tag
      # (controlled via FORCE_REFRESH_* env vars) and read everything older
      # straight off disk. Vulnerability JSON is cached so the scanner can
      # refresh a bounded recent window while preserving older catalog data.
      #
      # Cache key scheme: the run_id makes each saved entry immutable (GH
      # Actions cache keys can't be overwritten); restore-keys do a prefix
      # match so the most recent prior cache is restored. The script hash in
      # the prefix busts the cache on any data-layer schema change.
      - name: Restore catalog data cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
            site/src/data/vulnerabilities
          key: catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/oci/*.go', 'cli/internal/sign/*.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/oci/*.go', 'cli/internal/sign/*.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      - name: Resolve fleet catalog parameters
        id: params
        run: |
          set -euo pipefail
          FLEET=$(./clearcutt --format json matrix export --source fleet)
          DEFAULT_LIMIT=$(jq -r '.catalog.releaseLimit' <<< "$FLEET")
          SCAN_DEPTH=$(jq -r '.catalog.scanDepth' <<< "$FLEET")
          INPUT_LIMIT="${{ github.event.inputs.release_limit || '' }}"
          if [[ -n "$INPUT_LIMIT" ]]; then
            echo "limit=${INPUT_LIMIT}" >> "$GITHUB_OUTPUT"
          else
            echo "limit=${DEFAULT_LIMIT}" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_depth=${SCAN_DEPTH}" >> "$GITHUB_OUTPUT"

      - name: Build catalog data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: ${{ steps.params.outputs.limit }}
          FORCE_REFRESH_ALL: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
          SCAN_ALL_TAGS: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_REFRESH_ALL}" == "1" ]]; then
            ./clearcutt catalog build \
              --limit "$RELEASE_LIMIT" \
              --scan-depth "${{ steps.params.outputs.scan_depth }}" \
              --force-refresh-all \
              --scan-all \
              --include-services
          else
            ./clearcutt catalog build \
              --limit "$RELEASE_LIMIT" \
              --scan-depth "${{ steps.params.outputs.scan_depth }}" \
              --include-services
          fi

      - name: Upload catalog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-data
          path: |
            site/src/data/catalog
            site/src/data/enrichment
            site/src/data/vulnerabilities
          retention-days: 7

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: gather
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download catalog data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-data
          path: site/src/data

      - name: Install site dependencies
        working-directory: site
        run: npm ci || npm install

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Generate OpenVEX documents
        run: |
          mkdir -p site/public/vex
          for id in $(jq -r '.images[].id' site/src/data/catalog/index.json | sort -u); do
            echo "Generating OpenVEX for ${id}..."
            ./clearcutt --catalog site/src/data/catalog vex "${id}" --output site/public/vex/"${id}".json
          done

      - name: Resolve Pages base path
        id: pages_base
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "site=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
          echo "base=/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Astro
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages_base.outputs.site }}
          BASE_PATH: ${{ steps.pages_base.outputs.base }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
