# Build and deploy the ClearCutt catalog site to GitHub Pages.
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Dynamic catalog rebuilt from immutable GitHub Release assets and live GHCR metadata

name: ClearCutt Catalog Site

on:
  workflow_dispatch:
    inputs:
      release_limit:
        description: "How many recent releases to ingest"
        required: false
        default: "10"
      force_refresh_all:
        description: "Ignore the cache and re-fetch enrichment + SBOMs for every release (slow; use when schema changes or attestations are re-attached)"
        required: false
        default: "false"
        type: boolean
  # Rebuild nightly so CVE / vulnerability data stays fresh as the Grype DB
  # picks up newly-disclosed advisories against pinned package versions in
  # the SBOMs. 06:00 UTC keeps it off the GHA peak hours.
  # We deliberately do NOT trigger on release: or workflow_run: because the
  # tag-release workflow runs against tag refs, not main, so a branch-pinned
  # workflow_run trigger never matches; cron + manual cover the freshness
  # need without the noise of permanently failing trigger evaluations.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gather:
    name: Gather catalog data
    runs-on: ubuntu-latest
    outputs:
      release-limit: ${{ steps.params.outputs.limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install crane, cosign, grype
        run: |
          set -euo pipefail
          # crane via go-containerregistry release tarball
          CRANE_VERSION=v0.20.6
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version
          # cosign binary
          COSIGN_VERSION=v2.4.1
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /tmp/cosign && sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version
          # grype via official install script
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype version

      # Cache the grype vuln DB so scheduled runs aren't paying 250MB+ of
      # download every nightly tick. Cache key tied to the day so the DB
      # naturally refreshes once per day.
      - name: Restore grype DB cache
        id: grype-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Refresh grype DB
        run: grype db update

      - name: Authenticate crane to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Cache the per-release enrichment + SBOM downloads. Old releases are
      # immutable: once an image is published, its manifest digests, layers,
      # OCI labels, and cosign attestations never change. The gather + enrich
      # scripts refresh only the most recent tag (controlled via FORCE_REFRESH_*
      # env vars) and read everything older straight off disk.
      #
      # Cache key scheme: the run_id makes each saved entry immutable (GH
      # Actions cache keys can't be overwritten); restore-keys do a prefix
      # match so the most recent prior cache is restored. The script hash in
      # the prefix busts the cache on any data-layer schema change.
      - name: Restore catalog data cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
          key: catalog-data-${{ runner.os }}-${{ hashFiles('scripts/gather-catalog.mjs', 'scripts/enrich-registry.mjs', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('scripts/gather-catalog.mjs', 'scripts/enrich-registry.mjs', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      - name: Set release limit
        id: params
        run: echo "limit=${{ github.event.inputs.release_limit || '10' }}" >> "$GITHUB_OUTPUT"

      - name: Gather release assets → catalog JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: ${{ steps.params.outputs.limit }}
          FORCE_REFRESH_ALL: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/gather-catalog.mjs --limit "$RELEASE_LIMIT"

      - name: Enrich with GHCR metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          FORCE_REFRESH_ALL: ${{ github.event.inputs.force_refresh_all == 'true' && '1' || '0' }}
        run: node scripts/enrich-registry.mjs

      # Scans each cached SBOM with grype. CVE data freshness comes from the
      # grype DB (refreshed above), not from the SBOMs themselves — so this
      # surfaces newly-disclosed vulnerabilities against pinned package
      # versions every time the workflow runs (including nightly cron).
      - name: Scan SBOMs with grype
        run: node scripts/scan-vulnerabilities.mjs

      - name: Re-run gather to fold enrichment + vulnerabilities in
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: ${{ steps.params.outputs.limit }}
          # No FORCE_REFRESH_ALL here: by this point SBOMs are already on disk
          # from the first pass, and we just need to re-fold the enrichment
          # and vulnerability scan output into per-image records.
        run: node scripts/gather-catalog.mjs --limit "$RELEASE_LIMIT"

      - name: Upload catalog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-data
          path: |
            site/src/data/catalog
            site/src/data/enrichment
            site/src/data/vulnerabilities
          retention-days: 7

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: gather
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download catalog data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-data
          path: site/src/data

      - name: Install site dependencies
        working-directory: site
        run: npm ci || npm install

      - name: Resolve Pages base path
        id: pages_base
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "site=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
          echo "base=/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Astro
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages_base.outputs.site }}
          BASE_PATH: ${{ steps.pages_base.outputs.base }}
        run: npm run build

      - name: Build Pagefind search index
        working-directory: site
        run: npx pagefind --site dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
