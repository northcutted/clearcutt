# Weekly nixpkgs input refresh for the image factory. Complements
# dependabot.yml (actions/gomod/npm): without this, core/flake.lock — the
# pin every published image is built from — has no automated update path.
#
# PRs opened with GITHUB_TOKEN do not trigger pull_request workflows (GitHub
# anti-recursion rule), so the PR body tells the reviewer how to start the
# pr-gate: close and reopen the PR, or push any commit to the branch.

name: ClearCutt Flake Update

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-flake-lock:
    name: Update core/flake.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update flake inputs
        id: update
        run: |
          set -euo pipefail
          nix flake update --flake ./core
          if git diff --quiet -- core/flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "core/flake.lock is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- core/flake.lock
          fi

      - name: Open Update Pull Request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="automation/flake-update"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add core/flake.lock
          git commit -m "chore: update core/flake.lock"
          # Refresh the remote-tracking ref so the forced update is visible in
          # the push output; the automation branch is owned by this workflow.
          git fetch origin "$branch" >/dev/null 2>&1 || true
          git push --force origin "$branch"

          body="Weekly automated refresh of the nixpkgs input in core/flake.lock.

          Validation is the pr-gate matrix (full build, scan, and conformance gates).
          PRs opened by GITHUB_TOKEN do not trigger pull_request workflows — **close
          and reopen this PR** (or push any commit to this branch) to start the gate.

          Review focus: the nixpkgs rev bump in core/flake.lock and the resulting
          package-version drift the gate's closure-diff check reports."

          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --head "$branch" \
              --title "chore: update core/flake.lock" \
              --body "$body"
          else
            echo "Open PR for $branch already exists; branch updated in place."
          fi
