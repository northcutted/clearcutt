# ClearCutt Scheduled Vulnerability Scan & Triage Gateway
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Ephemeral hourly cron scanning with automatic classification

name: ClearCutt Scheduled Scan

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    name: Run Scheduled CVE Scan
    runs-on: ubuntu-latest
    # Hard cap on total wall time. The auto-patch loop is the only step that
    # can plausibly approach this — everything before it finishes in <60s.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype version

      # Cache the per-release enrichment + SBOM downloads to keep hourly scans fast and optimized.
      - name: Restore catalog data cache
        uses: actions/cache@v4
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
          key: catalog-data-${{ runner.os }}-${{ hashFiles('scripts/gather-catalog.mjs', 'scripts/enrich-registry.mjs', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('scripts/gather-catalog.mjs', 'scripts/enrich-registry.mjs', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      - name: Gather release assets → catalog JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: "10"
        run: node scripts/gather-catalog.mjs --limit "$RELEASE_LIMIT"

      - name: Run Scheduled Scan
        run: ./scripts/scheduled-scan.sh

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
            accept-flake-config = true
            substituters = https://cache.nixos.org https://nix-cache.clearcutt.dev
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= clearcutt-cache-1:0O2A23T11EBggh2Uz+LJcaRMBpuS9eUjeWmXKP0QoDE=
            connect-timeout = 5
            download-attempts = 3

      # Persist /nix/store between runs. Without this every cold runner has to
      # re-fetch the unpatched base closure from R2 even when nothing in the
      # flake.lock changed.
      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', 'overlays/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Run AI CVE Auto-Patch Dispatcher
        # Bound the LLM/build loop. The job-level cap catches infinite loops;
        # this step-level cap stops a single agent invocation from eating the
        # entire 45 min budget if there are many findings.
        timeout-minutes: 30
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_PAID_MODEL: "openrouter/free"
          OPENROUTER_FALLBACK_MODEL: "openrouter/free"
          # Cap how many distinct findings one run will attempt. Anything over
          # this gets picked up on the next scheduled run.
          MAX_FINDINGS_PER_RUN: "5"
        run: |
          ./scripts/auto-patch-triage.py

      - name: Upload Scanned Vulnerabilities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerabilities-data
          path: site/src/data/vulnerabilities/
          retention-days: 7
