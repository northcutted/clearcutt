# ClearCutt Manual Vulnerability Scan & Remediation Gateway
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Manual fail-closed remediation scan with planned AI patch drafting

name: ClearCutt Manual Remediation Scan

on:
  workflow_dispatch:
    inputs:
      include_dev_only:
        description: "Also attempt dev-tier-only remediation campaigns"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

# Only one remediation scan in flight at a time — concurrent runs would race
# on `cve-remediation/*` branches and remote PR state.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Run Manual CVE Remediation Scan
    runs-on: ubuntu-latest
    # Hard cap on total wall time. The auto-patch loop is the only step that
    # can plausibly approach this — everything before it finishes in <60s.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype version

      # Cache the per-release enrichment + SBOM downloads to keep hourly scans fast and optimized.
      - name: Restore catalog data cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
          key: catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      # Both the remediation scan and dispatcher now use the Go CLI: `scan`
      # replaced the retired Node scanner, and `remediation plan` replaced the
      # retired Python broker.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Gather release assets → catalog JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: "10"
        run: ./clearcutt catalog gather --limit "$RELEASE_LIMIT"

      - name: Run Remediation Scan
        env:
          SCAN_MODE: remediation
          SCAN_TAG_DEPTH: "1"
          CLEARCUTT_BIN: ${{ github.workspace }}/clearcutt
        run: ./core/scripts/scheduled-scan.sh

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # Persist /nix/store between runs. Without this every cold runner has to
      # re-fetch the unpatched base closure from R2 even when nothing in the
      # flake.lock changed.
      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('core/flake.lock', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Run Go Remediation Dispatcher
        # Bound the LLM/build loop. The job-level cap catches infinite loops;
        # this step-level cap stops a single agent invocation from eating the
        # entire 45 min budget if there are many findings.
        timeout-minutes: 30
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_FREE_MODEL: "openrouter/free"
          OPENROUTER_PAID_MODEL: "openrouter/free"
          OPENROUTER_FALLBACK_MODEL: "openrouter/free"
          # Cap how many distinct findings one run will attempt. Anything over
          # this gets picked up on the next scheduled run.
          MAX_FINDINGS_PER_RUN: "1"
          # Dev-tier-only campaigns are intentionally not included here. They
          # can be tested with the include_dev_only workflow dispatch input.
          INCLUDE_DEV_ONLY_REMEDIATION: ${{ inputs.include_dev_only }}
          VULN_ROOT: ../site/src/data/vulnerabilities
          MAX_PATCH_FAILURES_PER_RUN: "1"
        working-directory: core
        run: |
          ../clearcutt remediation run \
            --vuln-root "$VULN_ROOT" \
            --limit "$MAX_FINDINGS_PER_RUN" \
            --max-failures "$MAX_PATCH_FAILURES_PER_RUN"

      - name: Upload Scanned Vulnerabilities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerabilities-data
          path: site/src/data/vulnerabilities/
          retention-days: 7
