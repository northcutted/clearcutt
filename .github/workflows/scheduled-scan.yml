# ClearCutt Approved Vulnerability Remediation Gateway
# Scheduled/gated remediation planning with bounded PR drafting.

name: ClearCutt Approved Remediation Scan

on:
  schedule:
    # Weekly planning run. By default this scans and uploads a remediation plan;
    # patch drafting requires explicit workflow_dispatch opt-in.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      include_dev_only:
        description: "Also attempt dev-tier-only remediation campaigns"
        required: false
        type: boolean
        default: false
      draft_patches:
        description: "Opt in to AI-assisted remediation PR drafting after scan/plan"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Only one remediation scan in flight at a time — concurrent runs would race
# on `cve-remediation/*` branches and remote PR state.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Run CVE Remediation Scan And Plan
    runs-on: ubuntu-latest
    # Hard cap on total wall time. The auto-patch loop is the only step that
    # can plausibly approach this — everything before it finishes in <60s.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Cache the per-release enrichment + SBOM downloads to keep hourly scans fast and optimized.
      - name: Restore catalog data cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            site/src/data/enrichment
            site/src/data/sboms
          key: catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-${{ github.run_id }}
          restore-keys: |
            catalog-data-${{ runner.os }}-${{ hashFiles('cli/internal/commands/catalog*.go', 'cli/internal/commands/scan.go', 'cli/internal/catalog/types.go', 'site/src/lib/catalog-schema.ts') }}-
            catalog-data-${{ runner.os }}-

      # Both the remediation scan and dispatcher now use the Go CLI: `scan`
      # replaced the retired Node scanner, and `remediation plan` replaced the
      # retired Python broker.
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Resolve fleet remediation parameters
        id: fleet
        run: |
          set -euo pipefail
          FLEET=$(./clearcutt --format json matrix export --source fleet)
          {
            echo "scan_depth=$(jq -r '.remediation.scanDepth' <<< "$FLEET")"
            echo "max_findings=$(jq -r '.remediation.maxFindingsPerRun' <<< "$FLEET")"
            echo "max_failures=$(jq -r '.remediation.maxPatchFailuresPerRun' <<< "$FLEET")"
            echo "include_dev_only=$(jq -r '.remediation.includeDevOnly' <<< "$FLEET")"
            echo "policy=$(jq -c '.remediation.policy // {}' <<< "$FLEET")"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Refresh CISA KEV cache
        run: |
          set -euo pipefail
          mkdir -p core/build-outputs/security-intel
          KEV_FILE="core/build-outputs/security-intel/known_exploited_vulnerabilities.json"
          KEV_STATUS="core/build-outputs/security-intel/kev-status.json"
          if curl -fsSL "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" -o "$KEV_FILE"; then
            jq '{status:"available", catalogVersion, dateReleased, count}' "$KEV_FILE" > "$KEV_STATUS"
          else
            rm -f "$KEV_FILE"
            printf '%s\n' '{"status":"unavailable"}' > "$KEV_STATUS"
          fi

      - name: Gather release assets → catalog JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          RELEASE_LIMIT: "10"
        run: ./clearcutt catalog gather --limit "$RELEASE_LIMIT"

      - name: Run Remediation Scan
        env:
          SCAN_MODE: remediation
          SCAN_TAG_DEPTH: ${{ steps.fleet.outputs.scan_depth }}
          CLEARCUTT_BIN: ${{ github.workspace }}/clearcutt
          KEV_FILE: ${{ github.workspace }}/core/build-outputs/security-intel/known_exploited_vulnerabilities.json
        run: |
          nix develop ./core \
            --extra-experimental-features "nix-command flakes" \
            --accept-flake-config \
            --command ./core/scripts/scheduled-scan.sh

      - name: Generate approved remediation plan
        env:
          VULN_ROOT: site/src/data/vulnerabilities
          INCLUDE_DEV_ONLY_REMEDIATION: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dev_only || steps.fleet.outputs.include_dev_only }}
          REMEDIATION_POLICY_JSON: ${{ steps.fleet.outputs.policy }}
        run: |
          set -euo pipefail
          INCLUDE_ARGS=()
          if [[ "${INCLUDE_DEV_ONLY_REMEDIATION}" == "true" ]]; then
            INCLUDE_ARGS+=(--include-dev-only)
          fi
          ./clearcutt --format json remediation plan \
            --vuln-root "$VULN_ROOT" \
            --limit "${{ steps.fleet.outputs.max_findings }}" \
            --policy-json "$REMEDIATION_POLICY_JSON" \
            --out core/build-outputs/remediation-plan.json \
            "${INCLUDE_ARGS[@]}"

      - name: Generate remediation report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f core/build-outputs/remediation-plan.json ]]; then
            ./clearcutt remediation report \
              --plan core/build-outputs/remediation-plan.json \
              --summary-dir core/build-outputs \
              --out core/build-outputs/remediation-report.json
          fi

      - name: Upload Scanned Vulnerabilities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerabilities-data
          path: site/src/data/vulnerabilities/
          retention-days: 7

      - name: Upload Remediation Plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation-plan
          path: |
            core/build-outputs/remediation-plan.json
            core/build-outputs/remediation-report.json
            core/build-outputs/remediation-summary-*.json
            core/build-outputs/security-intel/
          retention-days: 7

  draft-patches:
    name: Draft Remediation PRs
    needs: scan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_patches }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Resolve fleet remediation parameters
        id: fleet
        run: |
          set -euo pipefail
          FLEET=$(./clearcutt --format json matrix export --source fleet)
          {
            echo "max_findings=$(jq -r '.remediation.maxFindingsPerRun' <<< "$FLEET")"
            echo "max_failures=$(jq -r '.remediation.maxPatchFailuresPerRun' <<< "$FLEET")"
            echo "include_dev_only=$(jq -r '.remediation.includeDevOnly' <<< "$FLEET")"
            echo "policy=$(jq -c '.remediation.policy // {}' <<< "$FLEET")"
          } >> "$GITHUB_OUTPUT"

      - name: Download scanned vulnerabilities
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vulnerabilities-data
          path: site/src/data/vulnerabilities

      - name: Download remediation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remediation-plan
          path: .

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Persist /nix/store between runs. Without this every cold runner has to
      # re-fetch the unpatched base closure from R2 even when nothing in the
      # flake.lock, shared build helpers, or CVE overlays changed.
      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('core/flake.lock', 'core/lib/**', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Cap each cold-miss save so the ~90 per-leg caches don't LRU-evict each
          # other under GitHub's 10GB/repo cache limit (no effect on a key hit).
          gc-max-store-size-linux: 5000000000

      - name: Run Go Remediation Dispatcher
        timeout-minutes: 30
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_FREE_MODEL: "openrouter/free"
          OPENROUTER_PAID_MODEL: "openrouter/free"
          OPENROUTER_FALLBACK_MODEL: "openrouter/free"
          MAX_FINDINGS_PER_RUN: ${{ steps.fleet.outputs.max_findings }}
          INCLUDE_DEV_ONLY_REMEDIATION: ${{ github.event_name == 'workflow_dispatch' && inputs.include_dev_only || steps.fleet.outputs.include_dev_only }}
          VULN_ROOT: ../site/src/data/vulnerabilities
          MAX_PATCH_FAILURES_PER_RUN: ${{ steps.fleet.outputs.max_failures }}
          REMEDIATION_POLICY_JSON: ${{ steps.fleet.outputs.policy }}
        working-directory: core
        run: |
          if [[ -z "${OPENROUTER_API_KEY}" ]]; then
            echo "::error::draft_patches=true requires OPENROUTER_API_KEY"
            exit 1
          fi
          INCLUDE_ARGS=()
          if [[ "${INCLUDE_DEV_ONLY_REMEDIATION}" == "true" ]]; then
            INCLUDE_ARGS+=(--include-dev-only)
          fi
          ../clearcutt remediation run \
            --vuln-root "$VULN_ROOT" \
            --limit "$MAX_FINDINGS_PER_RUN" \
            --max-failures "$MAX_PATCH_FAILURES_PER_RUN" \
            --plan-out build-outputs/remediation-plan.json \
            --policy-json "$REMEDIATION_POLICY_JSON" \
            "${INCLUDE_ARGS[@]}"

      - name: Generate remediation report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f core/build-outputs/remediation-plan.json ]]; then
            ./clearcutt remediation report \
              --plan core/build-outputs/remediation-plan.json \
              --summary-dir core/build-outputs \
              --out core/build-outputs/remediation-report.json
          fi

      - name: Upload Remediation Draft Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation-draft-results
          path: |
            core/build-outputs/remediation-plan.json
            core/build-outputs/remediation-report.json
            core/build-outputs/remediation-summary-*.json
          retention-days: 7
