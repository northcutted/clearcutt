# ClearCutt Hardened Fleets Heavy End-to-End (E2E) Runtime Lifecycle Tests
# Heavy runtime build, run, rebase, and verification workflow.

name: ClearCutt E2E Runtimes

# On pull requests this suite runs as part of the ClearCutt PR Gating
# workflow (pr-gate.yml calls it via workflow_call) so reviewers watch a
# single workflow; workflow_dispatch remains for manual runs.
on:
  workflow_dispatch:
  workflow_call:

# contents: read is all this suite needs. The E2E lifecycle tests never touch
# GHCR or Sigstore: core/tests/e2e-runtimes.sh pushes to a throwaway local
# registry (localhost:5001, skopeo --dest-tls-verify=false) and asserts
# signing behavior with a mock cosign stub (MOCK_COSIGN), so packages: write
# and id-token: write must not be re-added here.
permissions:
  contents: read

# No workflow-level concurrency here: inside a workflow_call, github.workflow
# resolves to the CALLING workflow's name, so a group declared here would
# collide with the PR gate's own group and cancel the parent run. The caller
# provides cancel-in-progress semantics for PRs.

jobs:
  e2e-lifecycle-matrix:
    name: E2E Lifecycle (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Warm-cache runs finish in minutes; sized for cold-cache rebuilds after
    # a CVE overlay or flake.lock change invalidates the nix cache key.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        language: [
          "java",
          "node",
          "python",
          "go",
          "dotnet",
          "rust",
          "cc",
          "core"
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go Environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-e2e-${{ runner.os }}-${{ matrix.language }}-${{ hashFiles('core/flake.lock', 'core/lib/**', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-e2e-${{ runner.os }}-${{ matrix.language }}-
          # Cap each cold-miss save so the ~90 per-leg caches don't LRU-evict each
          # other under GitHub's 10GB/repo cache limit (no effect on a key hit).
          gc-max-store-size-linux: 5000000000

      - name: Install Cosign & Skopeo Natively
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Execute Heavy E2E Runtime Test
        run: |
          chmod +x core/tests/e2e-runtimes.sh
          ./core/tests/e2e-runtimes.sh "${{ matrix.language }}"

      - name: Upload Scrapeable E2E Catalog Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ matrix.language }}
          path: e2e-report-${{ matrix.language }}.json
          retention-days: 14
