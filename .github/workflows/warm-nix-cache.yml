# ClearCutt Warm Nix Binary Cache
#
# Seeds the optional R2-backed Nix binary cache (release.nixCache in
# clearcutt.fleet.yaml) with the OVERLAID build toolchain for the current ref's
# CVE overlay set, so cold PR-gate legs SUBSTITUTE openssl/sqlite/python/
# p11-kit/pytest-xdist/... instead of rebuilding them from source (and hitting
# their sandbox-flaky tests).
#
# Why this exists: the CVE remediation overlays rebind openssl/sqlite and patch
# the default python, giving the whole toolchain store hashes that miss
# cache.nixos.org. release.yml only publishes the IMAGE runtime closure on
# push-to-main, so the build toolchain (and feature branches' overlay sets) is
# never cached. This workflow builds each target inside the dev shell and pushes
# BOTH the image and dev-shell build closures with `fleet publish-cache
# --include-build-deps`.
#
# SECURITY: this is workflow_dispatch-only (so it cannot be triggered by fork
# PRs — only accounts with write access) AND gated behind the `production`
# environment, because it uses the R2 WRITE credentials and the cache signing
# key. The PR gate only ever CONSUMES the cache via the public base URL + the
# published public key (no secrets), so warming the cache never widens fork-PR
# exposure. Run it on a branch after changing core/overlays/**, or on main.

name: ClearCutt Warm Nix Cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed-gate:
    name: Approve Cache Seeding
    runs-on: ubuntu-latest
    # Single manual approval for the whole seeding run; the R2 write secrets are
    # only reached after this gate. Matrix jobs below inherit the gate via needs.
    environment: production
    steps:
      - name: Confirm seeding approved
        run: echo "Cache seeding approved for ${{ github.ref }}."

  fleet-matrix:
    name: Resolve Fleet Matrix
    needs: [seed-gate]
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.matrix.outputs.release_matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Export fleet matrix
        id: matrix
        run: |
          set -euo pipefail
          RELEASE_MATRIX=$(./clearcutt --format json matrix export --source fleet --github-actions --matrix release | jq -c .)
          echo "release_matrix=${RELEASE_MATRIX}" >> "$GITHUB_OUTPUT"

  prime-toolchain:
    name: Prime Shared Toolchain (${{ matrix.system }})
    needs: [seed-gate]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # The expensive, from-source part of a cold leg is the SHARED toolchain: the
    # dev-shell scanners (skopeo -> p11-kit) and everything that links the
    # rebound openssl/sqlite (glib, gnutls, curl...). It is identical for every
    # runtime leg. Build it once per arch on the minimal coreLTS target and push
    # it (image + dev-shell build closures) to R2 FIRST, so the per-runtime seed
    # jobs below substitute it and only compile their own interpreter delta —
    # turning ~5h cold legs into ~the e2e legs' wall time. This is the
    # make-or-break job: it must finish a cold world rebuild under GitHub's hard
    # 6h job ceiling. If it cannot, the openssl/sqlite rebinds need scoping to
    # runtime closures so the toolchain stays on cache.nixos.org.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Minimal runtime so the build is dominated by the shared toolchain we
      # want cached, not runtime-specific packages.
      - name: Build And Certify coreLTS
        run: |
          ./clearcutt fleet certify-target \
            --system "${{ matrix.system }}" \
            --language "coreLTS" \
            --tier "distroless" \
            --core-dir core

      - name: Publish Shared Build Closure To Nix Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          ./clearcutt fleet publish-cache \
            --system "${{ matrix.system }}" \
            --language "coreLTS" \
            --tier "distroless" \
            --core-dir core \
            --include-build-deps

  seed:
    name: Seed Cache (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    # Wait for the shared toolchain to land in R2 so these legs substitute it
    # instead of each rebuilding the openssl-linked world from source.
    needs: [seed-gate, fleet-matrix, prime-toolchain]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # A cold leg is a world rebuild; match the PR gate's heavy-job cap.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.release_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Build (and SBOM/scan) the target inside the dev shell so both the image
      # build closure AND the dev-shell toolchain closure are realized locally.
      - name: Build And Certify Target
        run: |
          ./clearcutt fleet certify-target \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

      - name: Publish Build Closure To Nix Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          ./clearcutt fleet publish-cache \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core \
            --include-build-deps
