# ClearCutt Release Trigger Workflow
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Automated Manual Release Gate & Tag Creation

name: ClearCutt Release Trigger

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Specify a custom version tag to release (e.g. 1.2.3). If left empty, the next version will be calculated automatically based on commits."
        required: false
        type: string

permissions:
  contents: write # Required to create and push the new git tag

jobs:
  trigger-release:
    name: Generate Tag & Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Fetches all history and tags to determine next semantic version

      - name: Calculate Next Version
        id: versioning
        if: ${{ github.event.inputs.custom_version == '' }}
        uses: paulhatch/semantic-version@8da30f99b5b2e7a26ced60b1dad2e41756d6edf4 # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Create and Push Release Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Determine target tag name
          CUSTOM_INPUT="${{ github.event.inputs.custom_version }}"
          if [ -n "$CUSTOM_INPUT" ]; then
            # Prepend 'v' if not present
            if [[ "$CUSTOM_INPUT" =~ ^v ]]; then
              TARGET_TAG="$CUSTOM_INPUT"
            else
              TARGET_TAG="v$CUSTOM_INPUT"
            fi
            echo "Using manually specified version tag: $TARGET_TAG"
          else
            TARGET_TAG="v${{ steps.versioning.outputs.version }}"
            echo "Using automatically calculated version tag: $TARGET_TAG"
          fi

          # 2. Safety Check: Verify if tag already exists in the repository
          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TARGET_TAG already exists in this repository. Aborting to prevent accidental overwrites." >&2
            exit 1
          fi

          # 3. Create and push the tag
          echo "Configuring Git credentials..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Tagging commit and pushing tag $TARGET_TAG to origin..."
          git tag "$TARGET_TAG"
          git push origin "$TARGET_TAG"

          echo "SUCCESS: Pushed release tag $TARGET_TAG successfully! The tag-release workflow has been triggered automatically."
