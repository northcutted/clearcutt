# ClearCutt Hardened Fleets Unified Release Workflow
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Environment-Gated Continuous Delivery with Automated OIDC Signing & SLSA L3 Provenance

name: ClearCutt Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Custom version tag to release (e.g. v1.0.0). If omitted, automatically calculated via conventional commits."
        required: false
        default: ""

permissions:
  contents: write # Required to push tags, commits, and upload final assets to the GitHub Release
  packages: write # Required to push OCI layered images to GHCR
  id-token: write # CRITICAL: Required for Sigstore Cosign OIDC Keyless signing
  statuses: write
  actions: read
  pages: write # Required to deploy the catalog site to GitHub Pages
  attestations: write # Required to create first-party GitHub Attestations

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-calc.outputs.version }}
      version_type: ${{ steps.version-calc.outputs.version_type }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: versioning
        uses: paulhatch/semantic-version@8da30f99b5b2e7a26ced60b1dad2e41756d6edf4 # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Resolve Version Output
        id: version-calc
        run: |
          CUSTOM_INPUT="${{ github.event.inputs.custom_version }}"
          if [ -n "$CUSTOM_INPUT" ]; then
            RAW_VERSION=$(echo "$CUSTOM_INPUT" | sed 's/^v//')
            echo "version_type=custom" >> $GITHUB_OUTPUT
          else
            RAW_VERSION="${{ steps.versioning.outputs.version }}"
            echo "version_type=${{ steps.versioning.outputs.version_type }}" >> $GITHUB_OUTPUT
          fi
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT

  prep-release-notes:
    name: Commit Staging Notes
    needs: check-version
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-version.outputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate and Commit Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          RAW_VERSION="${{ needs.check-version.outputs.version }}"
          NEXT_TAG="v$RAW_VERSION"
          NOTES_PATH="docs/releases/${NEXT_TAG}.md"

          # Generate notes via GitHub API
          echo "Generating release changelog via GitHub API..."
          BODY=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$NEXT_TAG" -f target_commitish="main" --jq '.body')

          mkdir -p docs/releases
          cat <<EOF > "$NOTES_PATH"
          # 📋 ClearCutt Hardened Fleet Staging Notes - $NEXT_TAG

          This staging notes document was automatically compiled for release **$NEXT_TAG**.

          ---

          $BODY
          EOF

          echo "Committing release notes file..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$NOTES_PATH"
          git commit -m "chore: compile release notes for $NEXT_TAG [skip ci]" || true
          
          # Push gracefully, ignoring errors if branch protection blocks direct commits to main
          git push origin main || echo "WARNING: Direct commit to main blocked by branch protection. Continuing..."

  release-gate:
    name: Staging Gate (Approve to Release v${{ needs.check-version.outputs.version }})
    needs: [check-version, prep-release-notes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-version.outputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    environment: production # <-- Manual approval gate here!
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create and Push Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          RAW_VERSION="${{ needs.check-version.outputs.version }}"
          VERSION_TAG="v$RAW_VERSION"
          
          echo "Release approved! Tagging commit and pushing $VERSION_TAG..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists in repository."
          else
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG"
          fi

  publish-matrix:
    name: Publish Target (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    needs: [check-version, release-gate]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        system: [
          "x86_64-linux",
          "aarch64-linux"
        ]
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "node24",
          "python3.13",
          "python3.14",
          "go1.25",
          "go1.26",
          "dotnet8",
          "dotnet10",
          "rust1.95",
          "cc15"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
            accept-flake-config = true
            substituters = https://cache.nixos.org https://nix-cache.clearcutt.dev
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= clearcutt-cache-1:0O2A23T11EBggh2Uz+LJcaRMBpuS9eUjeWmXKP0QoDE=

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/flake.lock') }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unified Gating and Release Pipeline
        env:
          GITHUB_REF_NAME: v${{ needs.check-version.outputs.version }}
        run: |
          nix develop --extra-experimental-features "nix-command flakes" --command ./pipeline/pipeline.sh \
            --system "${{ matrix.system }}" \
            --publish \
            --version-tag "v${{ needs.check-version.outputs.version }}" \
            "${{ matrix.language }}-${{ matrix.tier }}"

      - name: Copy Certified Derivations to Cloudflare R2 Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "${{ secrets.NIX_CACHE_SECRET_KEY }}" > secret-key.pem
          nix copy --option secret-key-files secret-key.pem \
            --to "s3://clearcutt-nix-cache?region=auto&endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            ".#packages.${{ matrix.system }}.\"${{ matrix.language }}-${{ matrix.tier }}\""
          rm secret-key.pem

      - name: Stage arch-suffixed release assets
        run: |
          set -euo pipefail
          ARCH_SUFFIX="amd64"
          if [[ "${{ matrix.system }}" == *"aarch64"* ]] || [[ "${{ matrix.system }}" == *"arm64"* ]]; then
            ARCH_SUFFIX="arm64"
          fi
          cp "build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json" \
             "build-outputs/${{ matrix.language }}-${{ matrix.tier }}-${ARCH_SUFFIX}.sbom.json"
          cp "build-outputs/${{ matrix.language }}-${{ matrix.tier }}.test-results.json" \
             "build-outputs/${{ matrix.language }}-${{ matrix.tier }}-${ARCH_SUFFIX}.test-results.json"

      - name: Upload SBOM Artifact (arch-suffixed for release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}-*.sbom.json
          retention-days: 7

      - name: Upload Test Results Artifact (arch-suffixed for release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}-*.test-results.json
          retention-days: 7

      - name: Upload SBOM Artifact (legacy unsuffixed for attestation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-sbom-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json
          retention-days: 7

      - name: Upload Test Results Artifact (legacy unsuffixed for attestation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-test-results-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.test-results.json
          retention-days: 7

  assemble-multiarch:
    name: Assemble Multi-Arch Manifest (${{ matrix.language }} - ${{ matrix.tier }})
    needs: [check-version, publish-matrix, release-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "node24",
          "python3.13",
          "python3.14",
          "go1.25",
          "go1.26",
          "dotnet8",
          "dotnet10",
          "rust1.95",
          "cc15"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create and Push Multi-Arch Manifest
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_TAG="ghcr.io/${REPO_PATH}/clearcutt-bootstrap"
          
          BOOTSTRAP_ROLLING="${BOOTSTRAP_TAG}:${NORM_LANG}-${{ matrix.tier }}"
          BOOTSTRAP_VERSIONED="${BOOTSTRAP_TAG}:v${{ needs.check-version.outputs.version }}-${NORM_LANG}-${{ matrix.tier }}"

          echo "Creating unified multi-arch manifest for rolling bootstrap tag: ${BOOTSTRAP_ROLLING}"
          docker buildx imagetools create -t "${BOOTSTRAP_ROLLING}" \
            "${BOOTSTRAP_TAG}:${NORM_LANG}-${{ matrix.tier }}-amd64" \
            "${BOOTSTRAP_TAG}:${NORM_LANG}-${{ matrix.tier }}-arm64"

          echo "Creating unified multi-arch manifest for versioned bootstrap tag: ${BOOTSTRAP_VERSIONED}"
          docker buildx imagetools create -t "${BOOTSTRAP_VERSIONED}" \
            "${BOOTSTRAP_TAG}:v${{ needs.check-version.outputs.version }}-${NORM_LANG}-${{ matrix.tier }}-amd64" \
            "${BOOTSTRAP_TAG}:v${{ needs.check-version.outputs.version }}-${NORM_LANG}-${{ matrix.tier }}-arm64"

      - name: Sign Multi-Arch Manifests
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_TAG="ghcr.io/${REPO_PATH}/clearcutt-bootstrap"
          
          cosign sign --yes "${BOOTSTRAP_TAG}:${NORM_LANG}-${{ matrix.tier }}"
          cosign sign --yes "${BOOTSTRAP_TAG}:v${{ needs.check-version.outputs.version }}-${NORM_LANG}-${{ matrix.tier }}"

      - name: Download amd64 SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-sbom-x86_64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/x86_64/

      - name: Download arm64 SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-sbom-aarch64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/aarch64/

      - name: Attest Multi-Arch SBOMs
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_ROLLING="ghcr.io/${REPO_PATH}/clearcutt-bootstrap:${NORM_LANG}-${{ matrix.tier }}"
          
          cosign attest --yes --type spdxjson --predicate "build-outputs/x86_64/${{ matrix.language }}-${{ matrix.tier }}.sbom.json" "${BOOTSTRAP_ROLLING}"
          cosign attest --yes --type spdxjson --predicate "build-outputs/aarch64/${{ matrix.language }}-${{ matrix.tier }}.sbom.json" "${BOOTSTRAP_ROLLING}"

      - name: Download amd64 Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-test-results-x86_64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/x86_64/

      - name: Download arm64 Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-test-results-aarch64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/aarch64/

      - name: Attest Multi-Arch Test Results
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_ROLLING="ghcr.io/${REPO_PATH}/clearcutt-bootstrap:${NORM_LANG}-${{ matrix.tier }}"
          
          cosign attest --yes --type custom --predicate "build-outputs/x86_64/${{ matrix.language }}-${{ matrix.tier }}.test-results.json" "${BOOTSTRAP_ROLLING}"
          cosign attest --yes --type custom --predicate "build-outputs/aarch64/${{ matrix.language }}-${{ matrix.tier }}.test-results.json" "${BOOTSTRAP_ROLLING}"

      - name: Resolve Multi-Arch Digest
        id: resolve-digest
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_ROLLING="ghcr.io/${REPO_PATH}/clearcutt-bootstrap:${NORM_LANG}-${{ matrix.tier }}"
          
          IMAGE_DIGEST=$(skopeo inspect "docker://${BOOTSTRAP_ROLLING}" --format "{{.Digest}}")
          echo "Multi-Arch manifest digest resolved: ${IMAGE_DIGEST}"
          echo "digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT

          mkdir -p build-outputs/digests
          cat <<EOF > "build-outputs/digests/${{ matrix.language }}-${{ matrix.tier }}.digest.json"
          {
            "image": "ghcr.io/${REPO_PATH}/clearcutt-bootstrap",
            "digest": "${IMAGE_DIGEST}"
          }
          EOF

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/clearcutt-bootstrap
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/clearcutt-bootstrap
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          sbom-path: "build-outputs/x86_64/${{ matrix.language }}-${{ matrix.tier }}.sbom.json"
          push-to-registry: true

      - name: Attest arm64 SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/clearcutt-bootstrap
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          sbom-path: "build-outputs/aarch64/${{ matrix.language }}-${{ matrix.tier }}.sbom.json"
          push-to-registry: true

      - name: Upload Multi-Arch Digest Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/digests/${{ matrix.language }}-${{ matrix.tier }}.digest.json
          retention-days: 7

  aggregate-digests:
    name: Aggregate Target Digests
    needs: assemble-multiarch
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compile.outputs.matrix }}
    steps:
      - name: Download all digest files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-outputs/
          pattern: release-digest-*
          merge-multiple: true

      - name: Compile Digest Matrix
        id: compile
        run: |
          python3 -c '
          import os, json
          digests = []
          for f in os.listdir("build-outputs"):
              if f.endswith(".digest.json"):
                  with open(os.path.join("build-outputs", f)) as j:
                      digests.append(json.load(j))
          print(f"matrix={json.dumps(digests)}")
          ' >> $GITHUB_OUTPUT

  provenance:
    name: Generate SLSA L3 Provenance
    needs: aggregate-digests
    permissions:
      id-token: write
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.aggregate-digests.outputs.matrix) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.target.image }}
      digest: ${{ matrix.target.digest }}
      registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  finalize-tags:
    name: Finalize GHCR UI Tag Ordering (${{ matrix.language }} - ${{ matrix.tier }})
    needs: [check-version, provenance, release-gate]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "node24",
          "python3.13",
          "python3.14",
          "go1.25",
          "go1.26",
          "dotnet8",
          "dotnet10",
          "rust1.95",
          "cc15"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Promote and publish clean production tags
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_TAG="ghcr.io/${REPO_PATH}/clearcutt-bootstrap"
          BASE_TAG="ghcr.io/${REPO_PATH}/clearcutt-${NORM_LANG}"
          
          ROLLING_TARGET="${BASE_TAG}:${{ matrix.tier }}"
          VERSIONED_TARGET="${BASE_TAG}:v${{ needs.check-version.outputs.version }}-${{ matrix.tier }}"

          BOOTSTRAP_ROLLING="${BOOTSTRAP_TAG}:${NORM_LANG}-${{ matrix.tier }}"
          BOOTSTRAP_VERSIONED="${BOOTSTRAP_TAG}:v${{ needs.check-version.outputs.version }}-${NORM_LANG}-${{ matrix.tier }}"

          echo "Promoting rolling multi-arch image and its signatures/attestations to production: ${ROLLING_TARGET}"
          cosign copy -f "${BOOTSTRAP_ROLLING}" "${ROLLING_TARGET}"

          echo "Promoting versioned multi-arch image and its signatures/attestations to production: ${VERSIONED_TARGET}"
          cosign copy -f "${BOOTSTRAP_VERSIONED}" "${VERSIONED_TARGET}"

      - name: Download and Export SLSA Provenance
        run: |
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          NORM_LANG=$(echo "${{ matrix.language }}" | tr '[:upper:]' '[:lower:]')
          BOOTSTRAP_ROLLING="ghcr.io/${REPO_PATH}/clearcutt-bootstrap:${NORM_LANG}-${{ matrix.tier }}"

          mkdir -p build-outputs/
          echo "Downloading SLSA L3 provenance for ${BOOTSTRAP_ROLLING}..."
          
          cosign download attestation --predicate-type "https://slsa.dev/provenance/v1" "${BOOTSTRAP_ROLLING}" > "build-outputs/${{ matrix.language }}-${{ matrix.tier }}.intoto.jsonl" || true
          
          if [ ! -s "build-outputs/${{ matrix.language }}-${{ matrix.tier }}.intoto.jsonl" ]; then
            echo "SLSA v1 provenance not found or empty. Trying v0.2 fallback..."
            cosign download attestation --predicate-type "https://slsa.dev/provenance/v0.2" "${BOOTSTRAP_ROLLING}" > "build-outputs/${{ matrix.language }}-${{ matrix.tier }}.intoto.jsonl" || true
          fi

          if [ -s "build-outputs/${{ matrix.language }}-${{ matrix.tier }}.intoto.jsonl" ]; then
            echo "SLSA L3 provenance attestation successfully downloaded."
          else
            echo "WARNING: SLSA L3 provenance attestation could not be downloaded or was empty."
          fi

      - name: Upload SLSA Provenance Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.intoto.jsonl
          retention-days: 7

  finalize-release:
    name: Finalize GitHub Release Assets
    needs: [check-version, publish-matrix, provenance, finalize-tags, release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-outputs/
          pattern: release-*
          merge-multiple: true

      - name: Create Release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.check-version.outputs.version }}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME does not exist. Creating it now..."
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes \
              --target "main"
          else
            echo "Release $TAG_NAME already exists."
          fi

      - name: Upload Certified Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Gathering SBOMs, test-results, and SLSA Provenance assets for upload..."
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find build-outputs/ -maxdepth 1 -type f \( -name "*.sbom.json" -o -name "*.test-results.json" -o -name "*.intoto.jsonl" \) -size +0 -print0)
          
          if [ ${#files[@]} -gt 0 ]; then
            echo "Uploading ${#files[@]} certified assets to release: v${{ needs.check-version.outputs.version }}..."
            gh release upload "v${{ needs.check-version.outputs.version }}" "${files[@]}" --clobber
            echo "Release assets successfully attached."
          else
            echo "No non-empty certified assets found to upload."
          fi

      - name: Finalize Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.check-version.outputs.version }}"
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          RAW_CHANGELOG=$(gh release view "$TAG_NAME" --json body --jq '.body' | grep -v 'This draft release represents' | grep -v 'To release these assets:' | grep -v "Simply click 'Publish Release'")

          read -r -d '' FINAL_NOTES <<EOF || true
          # 🚀 ClearCutt Hardened Fleet Release $TAG_NAME

          This release has been **cryptographically certified** with **Zero-CVE** status and **SLSA Level 3 non-falsifiable provenance** across our multi-architecture fleet (supporting both \`amd64\` and \`arm64\` natively).

          All OCI layered manifests have been keylessly signed via Sigstore OIDC, and full SPDX SBOM audits are attached as release assets.

          ---

          ## 🐳 OCI Container Registry Directory
          Images are published to GHCR. You can pull the multi-architecture manifests directly:

          | Language Target | Distroless Tier (Shell-Less Hardened) | Slim Tier (Runtime-Only Hardened) | Dev Tier (Full Compiler/Tools) |
          |---|---|---|---|
          | **Bash / LTS Core** | \`ghcr.io/${REPO_PATH}/clearcutt-corelts:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-corelts:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-corelts:dev\` |
          | **Node 22** | \`ghcr.io/${REPO_PATH}/clearcutt-node22:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-node22:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-node22:dev\` |
          | **Node 24** | \`ghcr.io/${REPO_PATH}/clearcutt-node24:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-node24:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-node24:dev\` |
          | **Python 3.13** | \`ghcr.io/${REPO_PATH}/clearcutt-python3.13:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-python3.13:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-python3.13:dev\` |
          | **Python 3.14** | \`ghcr.io/${REPO_PATH}/clearcutt-python3.14:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-python3.14:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-python3.14:dev\` |
          | **Go 1.25** | \`ghcr.io/${REPO_PATH}/clearcutt-go1.25:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-go1.25:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-go1.25:dev\` |
          | **Go 1.26** | \`ghcr.io/${REPO_PATH}/clearcutt-go1.26:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-go1.26:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-go1.26:dev\` |
          | **Java 21** | \`ghcr.io/${REPO_PATH}/clearcutt-java21:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-java21:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-java21:dev\` |
          | **Java 25** | \`ghcr.io/${REPO_PATH}/clearcutt-java25:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-java25:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-java25:dev\` |
          | **.NET 8** | \`ghcr.io/${REPO_PATH}/clearcutt-dotnet8:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-dotnet8:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-dotnet8:dev\` |
          | **.NET 10** | \`ghcr.io/${REPO_PATH}/clearcutt-dotnet10:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-dotnet10:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-dotnet10:dev\` |
          | **Rust 1.95** | \`ghcr.io/${REPO_PATH}/clearcutt-rust1.95:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-rust1.95:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-rust1.95:dev\` |
          | **C/C++ 15** | \`ghcr.io/${REPO_PATH}/clearcutt-cc15:distroless\` | \`ghcr.io/${REPO_PATH}/clearcutt-cc15:slim\` | \`ghcr.io/${REPO_PATH}/clearcutt-cc15:dev\` |

          > [!NOTE]
          > All image tiers are also published under versioned tags matching this release: \`ghcr.io/${REPO_PATH}/clearcutt-<language>:${TAG_NAME}-<tier>\`.

          ---

          ## ❄️ Declarative Nix Flake Integration
          Downstream development projects can consume these exact secure runtime runtimes natively in their Nix flakes:

          \`\`\`nix
          # Add this repository to your flake inputs:
          inputs.clearcutt.url = "github:${REPO_PATH}/${TAG_NAME}";

          # In your outputs, use the overlays or raw runtime packages:
          outputs = { self, nixpkgs, clearcutt, ... }: {
            devShells.x86_64-linux.default = nixpkgs.legacyPackages.x86_64-linux.mkShell {
              buildInputs = [
                # Access secure, identical overlays
                clearcutt.packages.x86_64-linux.java21-dev
              ];
            };
          };
          \`\`\`

          ---

          $RAW_CHANGELOG
          EOF

          gh release edit "$TAG_NAME" --notes "$FINAL_NOTES"
          echo "Release notes successfully finalized and beautified."

  deploy-site:
    name: Deploy Catalog Site
    needs: finalize-release
    uses: ./.github/workflows/publish-pages.yml
    secrets: inherit
