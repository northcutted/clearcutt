# ClearCutt Hardened Fleets Automated Release Pipeline
# Paradigm: SLSA v1 Certified OCI Matrix Compilation, Gating, & Keyless Attestation
# Brand Owner & Principal Architect: Eddie Northcutt

name: ClearCutt Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Configure top-level permissions required for GHCR write and Cosign OIDC token request
permissions:
  contents: read
  packages: write
  id-token: write # CRITICAL: Required for Sigstore Cosign OIDC Keyless signing

jobs:
  certify-matrix:
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm64' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        system: [
          "x86_64-linux",
          "aarch64-linux"
        ]
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "python3.13",
          "go1.25",
          "dotnet8.0",
          "dotnet10.0"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.7

      # Setup Nix on the GHA runner
      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      # Modern, zero-config magic caching for Nix packages
      - name: Setup Magic Nix Cache
        uses: determinateSystems/magic-nix-cache-action@v2

      # Install Cosign binary natively
      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.4.0

      # Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Execute dynamic pipeline scans, builds, publishing, signing and attestations
      - name: Run Unified Gating and Release Pipeline
        run: |
          nix develop --extra-experimental-features "nix-command flakes" --command ./pipeline/pipeline.sh \
            --system "${{ matrix.system }}" \
            --publish \
            "${{ matrix.language }}-${{ matrix.tier }}"

      # Upload SPDX SBOM as workflow run artifact for supply chain traceability
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json
          retention-days: 14

      # Upload SLSA Provenance as workflow run artifact
      - name: Upload SLSA Provenance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.provenance.json
          retention-days: 14
