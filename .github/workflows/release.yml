# ClearCutt Hardened Fleets Unified Release Workflow
# Brand Owner & Principal Architect: Eddie Northcutt
# Paradigm: Environment-Gated Continuous Delivery with Automated OIDC Signing & SLSA L3 Provenance

name: ClearCutt Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Custom version tag to release (e.g. v1.0.0). If omitted, automatically calculated via conventional commits."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# Releases mutate GHCR tags + SLSA provenance. The release identity is pinned to
# refs/heads/main in clearcutt.fleet.yaml and admission examples, so dispatches
# from other refs are rejected before any mutable release work starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-calc.outputs.version }}
      version_type: ${{ steps.version-calc.outputs.version_type }}
    steps:
      - name: Enforce main release identity
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::ClearCutt release identity is pinned to refs/heads/main. Dispatch releases from main, or update fleet config, policies, and verifier commands together."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: versioning
        uses: paulhatch/semantic-version@8da30f99b5b2e7a26ced60b1dad2e41756d6edf4 # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Resolve Version Output
        id: version-calc
        run: |
          CUSTOM_INPUT="${{ github.event.inputs.custom_version }}"
          if [ -n "$CUSTOM_INPUT" ]; then
            RAW_VERSION="${CUSTOM_INPUT#v}"
            echo "version_type=custom" >> "$GITHUB_OUTPUT"
          else
            RAW_VERSION="${{ steps.versioning.outputs.version }}"
            echo "version_type=${{ steps.versioning.outputs.version_type }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

  release-gate:
    name: Staging Gate (Approve to Release v${{ needs.check-version.outputs.version }})
    needs: [check-version]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-version.outputs.version_type != 'none' }}
    runs-on: ubuntu-latest
    environment: production # <-- Manual approval gate here!
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create and Push Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          RAW_VERSION="${{ needs.check-version.outputs.version }}"
          VERSION_TAG="v$RAW_VERSION"
          
          echo "Release approved! Tagging commit and pushing $VERSION_TAG..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists in repository."
          else
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG"
          fi

  fleet-matrix:
    name: Resolve Fleet Matrix
    needs: [check-version, release-gate]
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.matrix.outputs.release_matrix }}
      image_matrix: ${{ steps.matrix.outputs.image_matrix }}
      service_release_matrix: ${{ steps.matrix.outputs.service_release_matrix }}
      service_image_matrix: ${{ steps.matrix.outputs.service_image_matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Export fleet matrices
        id: matrix
        run: |
          set -euo pipefail
          RELEASE_MATRIX=$(./clearcutt --format json matrix export --source fleet --github-actions --matrix release | jq -c .)
          IMAGE_MATRIX=$(./clearcutt --format json matrix export --source fleet --github-actions --matrix image | jq -c .)
          SERVICE_RELEASE_MATRIX=$(./clearcutt --format json service matrix --github-actions --matrix release | jq -c .)
          SERVICE_IMAGE_MATRIX=$(./clearcutt --format json service matrix --github-actions --matrix image | jq -c .)
          {
            echo "release_matrix=${RELEASE_MATRIX}"
            echo "image_matrix=${IMAGE_MATRIX}"
            echo "service_release_matrix=${SERVICE_RELEASE_MATRIX}"
            echo "service_image_matrix=${SERVICE_IMAGE_MATRIX}"
          } >> "$GITHUB_OUTPUT"

  publish-matrix:
    name: Publish Target (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    needs: [check-version, release-gate, fleet-matrix]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.release_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('core/flake.lock', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v3 so signing/attesting uses the new bundle format
          # (OCI 1.1 referrers) by default. Keep in lockstep with publish-pages.yml.
          cosign-release: 'v3.0.6'

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Single-Arch Fleet Target
        env:
          GITHUB_REF_NAME: v${{ needs.check-version.outputs.version }}
        run: |
          ./clearcutt fleet publish-target \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --version-tag "v${{ needs.check-version.outputs.version }}" \
            --core-dir core

      - name: Publish Optional Nix Binary Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          ./clearcutt fleet publish-cache \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

      - name: Upload SBOM Artifact (arch-suffixed for release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}-*.sbom.json
          retention-days: 7

      - name: Upload Test Results Artifact (arch-suffixed for release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}-*.test-results.json
          retention-days: 7

      - name: Upload SBOM Artifact (legacy unsuffixed for attestation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-sbom-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}.sbom.json
          retention-days: 7

      - name: Upload Test Results Artifact (legacy unsuffixed for attestation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-test-results-${{ matrix.system }}-${{ matrix.language }}-${{ matrix.tier }}
          path: core/build-outputs/${{ matrix.language }}-${{ matrix.tier }}.test-results.json
          retention-days: 7

  publish-service-matrix:
    name: Publish Service (${{ matrix.system }} - ${{ matrix.service }})
    needs: [check-version, release-gate, fleet-matrix]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.service_release_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-service-${{ matrix.system }}-${{ hashFiles('core/flake.lock', 'core/lib/service-extensions.nix', 'core/overlays/**') }}
          restore-prefixes-first-match: nix-service-${{ matrix.system }}-

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Single-Arch Service Target
        env:
          GITHUB_REF_NAME: v${{ needs.check-version.outputs.version }}
        run: |
          ./clearcutt service publish "${{ matrix.service }}" \
            --system "${{ matrix.system }}" \
            --version-tag "v${{ needs.check-version.outputs.version }}" \
            --core-dir core

      - name: Validate Service OCI Contract and Smoke
        env:
          CLEARCUTT_CLI: ./clearcutt
        run: core/tests/service-image-contract.sh "${{ matrix.service }}" "core/build-outputs/${{ matrix.service }}.tar.gz"

      - name: Upload Service SBOM Artifact (arch-suffixed for release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.system }}-${{ matrix.service }}-service
          path: core/build-outputs/${{ matrix.service }}-*.sbom.json
          retention-days: 7

      - name: Upload Service Test Results Artifact (arch-suffixed for release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ matrix.system }}-${{ matrix.service }}-service
          path: core/build-outputs/${{ matrix.service }}-*.test-results.json
          retention-days: 7

      - name: Upload Service SBOM Artifact (legacy unsuffixed for attestation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-sbom-${{ matrix.system }}-${{ matrix.service }}-service
          path: core/build-outputs/${{ matrix.service }}.sbom.json
          retention-days: 7

      - name: Upload Service Test Results Artifact (legacy unsuffixed for attestation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-test-results-${{ matrix.system }}-${{ matrix.service }}-service
          path: core/build-outputs/${{ matrix.service }}.test-results.json
          retention-days: 7

  build-cli:
    name: Build & Sign Go CLI Binaries
    needs: [check-version, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Compile CLI Matrix
        shell: bash
        run: |
          mkdir -p build-outputs
          VERSION="v${{ needs.check-version.outputs.version }}"
          
          platforms=(
            "darwin/amd64/clearcutt-darwin-amd64"
            "darwin/arm64/clearcutt-darwin-arm64"
            "linux/amd64/clearcutt-linux-amd64"
            "linux/arm64/clearcutt-linux-arm64"
            "windows/amd64/clearcutt-windows-amd64.exe"
            "windows/arm64/clearcutt-windows-arm64.exe"
          )
          
          for p in "${platforms[@]}"; do
            goos=$(echo "$p" | cut -d'/' -f1)
            goarch=$(echo "$p" | cut -d'/' -f2)
            name=$(echo "$p" | cut -d'/' -f3)
            echo "Compiling $name ($goos/$goarch)..."
            (
              cd cli
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
                -ldflags="-s -w -X github.com/northcutted/clearcutt/internal/commands.Version=$VERSION" \
                -o "../build-outputs/$name" \
                ./cmd/clearcutt
            )
          done


      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Keylessly Sign CLI Binaries
        run: |
          cd build-outputs
          for file in clearcutt-*; do
            echo "Keylessly signing $file..."
            cosign sign-blob --yes "$file" \
              --bundle "$file.sig"
          done

      - name: Generate Checksums
        run: |
          cd build-outputs
          sha256sum clearcutt-* > SHA256SUMS.txt

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-binaries
          path: |
            build-outputs/clearcutt-*
            build-outputs/SHA256SUMS.txt
          retention-days: 7

  assemble-multiarch:
    name: Assemble Multi-Arch Manifest (${{ matrix.language }} - ${{ matrix.tier }})
    needs: [check-version, publish-matrix, release-gate, fleet-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.image_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v3 so signing/attesting uses the new bundle format by
          # default. Keep in lockstep with publish-pages.yml.
          cosign-release: 'v3.0.6'

      - name: Install crane
        run: |
          set -euo pipefail
          # crane assembles the multi-arch index as a native OCI image index
          # (application/vnd.oci.image.index.v1+json). `docker buildx imagetools
          # create` emits a Docker manifest list, which cosign v3's new bundle
          # format refuses to sign ("fallback tag manifest is not an OCI image
          # index"). crane authenticates via the docker config written by the
          # GHCR login step above.
          CRANE_VERSION=v0.20.6
          CRANE_TARBALL=go-containerregistry_Linux_x86_64.tar.gz
          CRANE_SHA256=c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127
          curl -fsSL -o "/tmp/${CRANE_TARBALL}" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${CRANE_TARBALL}"
          printf '%s  %s\n' "${CRANE_SHA256}" "/tmp/${CRANE_TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${CRANE_TARBALL}" -C /usr/local/bin crane
          crane version

      - name: Download amd64 SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-sbom-x86_64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/x86_64/

      - name: Download arm64 SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-sbom-aarch64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/aarch64/

      - name: Download amd64 Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-test-results-x86_64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/x86_64/

      - name: Download arm64 Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-test-results-aarch64-linux-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/aarch64/

      - name: Assemble, Sign, Attest, and Resolve Multi-Arch Target
        id: resolve-digest
        run: |
          ./clearcutt fleet assemble-target \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --version-tag "v${{ needs.check-version.outputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.resolve-digest.outputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ steps.resolve-digest.outputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          sbom-path: "build-outputs/x86_64/${{ matrix.language }}-${{ matrix.tier }}.sbom.json"
          push-to-registry: true

      - name: Attest arm64 SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ steps.resolve-digest.outputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          sbom-path: "build-outputs/aarch64/${{ matrix.language }}-${{ matrix.tier }}.sbom.json"
          push-to-registry: true

      - name: Upload Multi-Arch Digest Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/digests/${{ matrix.language }}-${{ matrix.tier }}.digest.json
          retention-days: 7

  assemble-service-multiarch:
    name: Assemble Multi-Arch Service (${{ matrix.service }})
    needs: [check-version, publish-service-matrix, release-gate, fleet-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.service_image_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Install crane
        run: |
          set -euo pipefail
          CRANE_VERSION=v0.20.6
          CRANE_TARBALL=go-containerregistry_Linux_x86_64.tar.gz
          CRANE_SHA256=c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127
          curl -fsSL -o "/tmp/${CRANE_TARBALL}" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${CRANE_TARBALL}"
          printf '%s  %s\n' "${CRANE_SHA256}" "/tmp/${CRANE_TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${CRANE_TARBALL}" -C /usr/local/bin crane
          crane version

      - name: Download amd64 Service SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-sbom-x86_64-linux-${{ matrix.service }}-service
          path: build-outputs/x86_64/

      - name: Download arm64 Service SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-sbom-aarch64-linux-${{ matrix.service }}-service
          path: build-outputs/aarch64/

      - name: Download amd64 Service Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-test-results-x86_64-linux-${{ matrix.service }}-service
          path: build-outputs/x86_64/

      - name: Download arm64 Service Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation-test-results-aarch64-linux-${{ matrix.service }}-service
          path: build-outputs/aarch64/

      - name: Assemble, Sign, Attest, and Resolve Service Target
        id: resolve-digest
        run: |
          ./clearcutt service assemble "${{ matrix.service }}" \
            --version-tag "v${{ needs.check-version.outputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Attest Service Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.resolve-digest.outputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 Service SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ steps.resolve-digest.outputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          sbom-path: "build-outputs/x86_64/${{ matrix.service }}.sbom.json"
          push-to-registry: true

      - name: Attest arm64 Service SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ steps.resolve-digest.outputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          sbom-path: "build-outputs/aarch64/${{ matrix.service }}.sbom.json"
          push-to-registry: true

      - name: Upload Service Multi-Arch Digest Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.service }}-service
          path: build-outputs/digests/${{ matrix.service }}.digest.json
          retention-days: 7

  aggregate-digests:
    name: Aggregate Target Digests
    needs: [check-version, assemble-multiarch, assemble-service-multiarch]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compile.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Download all digest files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-outputs/
          pattern: release-digest-*
          merge-multiple: true

      - name: Compile Digest Matrix
        id: compile
        run: |
          ./clearcutt --format json fleet aggregate-digests \
            --build-outputs build-outputs \
            --github-output "$GITHUB_OUTPUT"

  provenance:
    name: Generate SLSA L3 Provenance
    needs: aggregate-digests
    permissions:
      id-token: write
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.aggregate-digests.outputs.matrix) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.target.image }}
      digest: ${{ matrix.target.digest }}
      registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-release-evidence:
    name: Verify Release Evidence (${{ matrix.target.language }} - ${{ matrix.target.tier }})
    needs: [check-version, aggregate-digests, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.aggregate-digests.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Install crane and slsa-verifier
        run: |
          set -euo pipefail
          CRANE_VERSION=v0.20.6
          CRANE_TARBALL=go-containerregistry_Linux_x86_64.tar.gz
          CRANE_SHA256=c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127
          curl -fsSL -o "/tmp/${CRANE_TARBALL}" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${CRANE_TARBALL}"
          printf '%s  %s\n' "${CRANE_SHA256}" "/tmp/${CRANE_TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${CRANE_TARBALL}" -C /usr/local/bin crane

          SLSA_VERIFIER_VERSION=v2.7.1
          SLSA_VERIFIER_SHA256=946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
          curl -fsSL -o /tmp/slsa-verifier \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
          printf '%s  %s\n' "${SLSA_VERIFIER_SHA256}" /tmp/slsa-verifier | sha256sum -c -
          chmod +x /tmp/slsa-verifier
          sudo mv /tmp/slsa-verifier /usr/local/bin/slsa-verifier

          crane version
          slsa-verifier version

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Verify signature, attestations, and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./clearcutt fleet verify-target \
            --ref "${{ matrix.target.image }}:${{ matrix.target.versionedTag }}" \
            --digest "${{ matrix.target.digest }}" \
            --workflow-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --source-ref "${{ github.ref }}" \
            --source-branch "${{ github.ref_name }}"

  export-provenance:
    name: Export SLSA Provenance Asset (${{ matrix.language }} - ${{ matrix.tier }})
    needs: [check-version, provenance, verify-release-evidence, release-gate, fleet-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.image_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v3 so signing/attesting uses the new bundle format
          # (OCI 1.1 referrers) by default. Keep in lockstep with publish-pages.yml.
          cosign-release: 'v3.0.6'

      # No promotion step: the multi-arch images, signatures, and attestations
      # were assembled in the production repo directly. We only mirror the SLSA
      # provenance into a downloadable release asset for offline verification.
      - name: Download and Export SLSA Provenance
        run: |
          ./clearcutt fleet export-provenance \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --build-outputs build-outputs

      - name: Upload SLSA Provenance Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ matrix.language }}-${{ matrix.tier }}
          path: build-outputs/${{ matrix.language }}-${{ matrix.tier }}.intoto.jsonl
          retention-days: 7

  export-service-provenance:
    name: Export Service SLSA Provenance Asset (${{ matrix.service }})
    needs: [check-version, provenance, verify-release-evidence, release-gate, fleet-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fleet-matrix.outputs.service_image_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Download and Export Service SLSA Provenance
        run: |
          ./clearcutt service export-provenance "${{ matrix.service }}" \
            --build-outputs build-outputs

      - name: Upload Service SLSA Provenance Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ matrix.service }}-service
          path: build-outputs/${{ matrix.service }}.intoto.jsonl
          retention-days: 7

  finalize-release:
    name: Finalize GitHub Release Assets
    needs: [check-version, publish-matrix, publish-service-matrix, provenance, verify-release-evidence, export-provenance, export-service-provenance, release-gate, build-cli, fleet-matrix]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-outputs/
          pattern: release-*
          merge-multiple: true

      - name: Finalize GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./clearcutt fleet finalize-release \
            --version-tag "v${{ needs.check-version.outputs.version }}" \
            --build-outputs build-outputs \
            --archive-release-notes

  deploy-site:
    name: Deploy Catalog Site
    needs: finalize-release
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    secrets: inherit
