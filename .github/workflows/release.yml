# ClearCutt Hardened Fleets Automated Release Pipeline
# Paradigm: SLSA L3 Compliant OCI Compilation, Gating, & Keyless Attestation
# Brand Owner & Principal Architect: Eddie Northcutt

name: ClearCutt Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Configure top-level permissions required for GHCR write and Cosign OIDC token request
permissions:
  contents: read
  packages: write
  id-token: write # CRITICAL: Required for Sigstore Cosign OIDC Keyless signing

jobs:
  certify-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [
          "coreLTS",
          "java21",
          "java25",
          "node22",
          "node24",
          "python3.13",
          "python3.14",
          "go1.25",
          "go1.26",
          "dotnet8.0",
          "dotnet10.0"
        ]
        tier: [
          "dev",
          "slim",
          "distroless"
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Nix on the GHA runner
      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      # Modern, zero-config magic caching for Nix packages
      - name: Setup Magic Nix Cache
        uses: determinateSystems/magic-nix-cache-action@v2

      # Install Cosign binary natively
      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.4.0

      # Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compile OCI Layered Image via Nix Flake
      - name: Compile OCI Layered Image
        run: |
          nix build ".#\"${{ matrix.language }}-${{ matrix.tier }}\""

      # Extract registry targets and copy via Skopeo
      - name: Publish OCI Image to GHCR
        run: |
          # Convert repository path to lowercase to satisfy registry rules
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}/clearcutt-${{ matrix.language }}:${{ matrix.tier }}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          # Direct registry copy via Skopeo (bypass docker daemon load overhead)
          nix shell nixpkgs#skopeo --command skopeo copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-archive:result" \
            "docker://${IMAGE_TAG}"

      # Extract cryptographic dependency graph and compile SPDX SBOM
      - name: Generate SPDX 2.3 SBOM
        run: |
          nix path-info --json -r result > path-info.json
          python3 pipeline/sbom-generator.py path-info.json > sbom.json
          
      # Upload SBOM as GHA run artifact for traceability
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.language }}-${{ matrix.tier }}
          path: sbom.json
          retention-days: 14

      # Cosign Cryptographic Appending (OIDC Keyless Signature)
      - name: Sign Container Image (Sigstore Keyless)
        run: |
          # Cosign uses GHA OIDC provider credentials to sign the image keylessly
          cosign sign --yes "${{ env.IMAGE_TAG }}"

      # Attest SPDX SBOM directly to the OCI Registry Image
      - name: Attest SPDX SBOM to Registry Manifest
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.json \
            "${{ env.IMAGE_TAG }}"
            
      - name: Confirm Image Gated, Certified, Signed, and Attested
        run: echo "Target matrix certified successfully."
