# ClearCutt Seed Nix Binary Cache
#
# Seeds the R2-backed Nix binary cache (release.nixCache in clearcutt.fleet.yaml)
# with the patched RUNTIME closures so cold PR-gate legs SUBSTITUTE the custom
# builds instead of recompiling them from source.
#
# Why this exists (and why it is leaner than the old warm-nix-cache):
#   Runtime-scoped CVE patching (the cveRemediationOverlay + runtimeCryptoOverlay
#   in core/flake.nix) keeps the build TOOLCHAIN, scanners, and dev shell on
#   stock packages, so cache.nixos.org substitutes them — there is no longer a
#   world-rebuild to prime. What still rebuilds from source on every cold leg is
#   the small set of CUSTOM patched artifacts: openssl-3.6.3, sqlite-3.53.2, and
#   the runtimes that link them (node, python, dotnet). Those have store hashes
#   that miss cache.nixos.org. This workflow builds those runtime closures once
#   and pushes them to R2; release.yml only publishes on push-to-main, so
#   feature branches that touch core/overlays/** would otherwise never be warm.
#
# Shape of the run:
#   * analyze  — DRY-RUN every production cell (no build) against the configured
#                substituters (cache.nixos.org + R2) and emit a matrix of ONLY
#                the cells that still have something to build. On a warm cache
#                this is empty and the run finishes in a minute. This is the
#                "figure out what actually needs rebuilding first" step.
#   * seed     — one job PER (system, language, tier) cell that needs work. Each
#                cell is an independent, dynamically generated phase: the matrix
#                IS the phasing, so no single job ever has to compile the whole
#                fleet under GitHub's hard 6h ceiling (the heaviest single cell,
#                dotnet, is ~3h). Each cell builds its image (which runs the
#                completeness gate, so seeding also re-validates no stock
#                openssl/sqlite ships) and pushes its runtime closure to R2.
#
# SECURITY: workflow_dispatch / push-to-main only (never fork-PR triggerable)
# AND gated behind the `production` environment, because the seed jobs use the
# R2 WRITE credentials and the cache signing key. The PR gate only ever CONSUMES
# the cache via the public base URL + published public key (no secrets), so
# seeding never widens fork-PR exposure. Run it after changing core/overlays/**
# or the registry, on a branch or on main.

name: ClearCutt Seed Nix Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/overlays/**'
      - 'core/lib/registry.nix'
      - 'core/flake.nix'
      - 'core/flake.lock'
      - 'clearcutt.fleet.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed-gate:
    name: Approve Cache Seeding
    runs-on: ubuntu-latest
    # Single manual approval gates the whole run; the R2 write secrets are only
    # reached by the seed jobs below, which inherit the gate via `needs`.
    environment: production
    steps:
      - name: Confirm seeding approved
        run: echo "Cache seeding approved for ${{ github.ref }}."

  analyze:
    name: Analyze Rebuild Set
    needs: [seed-gate]
    runs-on: ubuntu-latest
    outputs:
      seed_matrix: ${{ steps.analyze.outputs.seed_matrix }}
      has_work: ${{ steps.analyze.outputs.has_work }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        # Writes the substituter config (cache.nixos.org + the R2 public base
        # url) so the dry-run below reflects what is ALREADY cached.
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Compute cells that still need building
        id: analyze
        # For every production cell, ask Nix what it WOULD build (eval +
        # substituter query only — no compilation). A cell with nothing to
        # build is already warm in cache.nixos.org or R2 and is skipped. Cross-
        # arch dry-run is valid: nix evaluates aarch64 derivations and queries
        # aarch64 substitutability from the x86 runner without building.
        run: |
          set -euo pipefail
          # The flake lives in core/, not the repo root — reference it explicitly.
          CORE_FLAKE="./core"
          RELEASE_MATRIX=$(./clearcutt --format json matrix export --source fleet --github-actions --matrix release | jq -c .)
          need='[]'
          errors=0
          while read -r row; do
            sys=$(jq -r '.system' <<<"$row")
            lang=$(jq -r '.language' <<<"$row")
            tier=$(jq -r '.tier' <<<"$row")
            inst="${CORE_FLAKE}#packages.${sys}.\"${lang}-${tier}\""
            echo "::group::dry-run ${sys} ${lang} ${tier}"
            # Run the dry-run on its own (NOT piped) so we can tell an eval/path
            # ERROR (non-zero exit) apart from a clean "nothing to build". A
            # failed dry-run must NEVER be silently treated as "cached" — that
            # would skip seeding and let an unverified, un-warmed runtime through.
            if nix build --dry-run "$inst" \
                 --extra-experimental-features 'nix-command flakes' \
                 --accept-flake-config >/tmp/dry.out 2>&1; then
              if grep -q 'will be built' /tmp/dry.out; then
                echo "NEEDS BUILD"
                need=$(jq -c ". += [${row}]" <<<"$need")
              else
                echo "cached — skipping"
              fi
            else
              echo "::error::dry-run FAILED for ${sys} ${lang} ${tier}"
              cat /tmp/dry.out
              errors=$((errors + 1))
            fi
            echo "::endgroup::"
          done < <(jq -c '.include[]' <<<"$RELEASE_MATRIX")
          if [ "$errors" -ne 0 ]; then
            echo "::error::${errors} cell(s) failed to evaluate; refusing to emit a partial seed set."
            exit 1
          fi
          count=$(jq 'length' <<<"$need")
          echo "Cells needing a seed build: ${count}"
          jq -r '.[] | "  - \(.system) \(.language) \(.tier)"' <<<"$need" || true
          {
            echo "seed_matrix={\"include\":${need}}"
            echo "has_work=$([ "$count" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  seed:
    name: Seed Cache (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    needs: [seed-gate, analyze]
    if: ${{ needs.analyze.outputs.has_work == 'true' }}
    # Each cell is its own phase. The heaviest patched runtime (dotnet, ~3h
    # cold) sits well under GitHub's 6h job ceiling; we keep the PR gate's heavy
    # cap so a pathological cell fails loudly instead of burning the ceiling.
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.analyze.outputs.seed_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'cli/go.mod'
          cache-dependency-path: 'cli/go.sum'
          cache: true

      - name: Build ClearCutt CLI
        run: |
          cd cli
          go build -o ../clearcutt ./cmd/clearcutt

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Build And Certify Target
        # Builds the image and runs the full security gate, so a seed build also
        # re-proves the runtime-patch completeness gate (no stock openssl/sqlite
        # ships) before the closure is published.
        run: |
          ./clearcutt fleet certify-target \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

      - name: Publish Runtime Closure To Nix Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          ./clearcutt fleet publish-cache \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

  seed-summary:
    name: Seed Summary
    needs: [analyze, seed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ needs.analyze.outputs.has_work }}" != "true" ]; then
            echo "Cache already warm — nothing to seed."
            exit 0
          fi
          # `seed` is skipped-or-success when has_work; treat any seed failure as fatal.
          if [ "${{ needs.seed.result }}" != "success" ]; then
            echo "One or more seed cells failed: ${{ needs.seed.result }}"
            exit 1
          fi
          echo "All needed cells seeded to R2."
