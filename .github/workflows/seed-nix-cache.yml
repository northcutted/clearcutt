# ClearCutt Seed Nix Binary Cache
#
# Seeds the R2-backed Nix binary cache (release.nixCache in clearcutt.fleet.yaml)
# with the fleet's RUNTIME closures so cold PR-gate legs SUBSTITUTE them instead
# of recompiling from source.
#
# Why this exists, and how much less it now matters:
#   It was built for runtime-scoped CVE patching, when the fleet shipped custom
#   openssl/sqlite rebuilds whose store hashes missed cache.nixos.org and so were
#   recompiled on every cold leg. Those overlays are gone: the four reference
#   runtime lines now build from stock nixpkgs, which cache.nixos.org already
#   substitutes. What is left to seed is the ClearCutt-specific derivations —
#   the jlink'd minimal JRE, the npm-severed node, and image assembly — which are
#   real but a fraction of the old cost. Keep it for cold-leg latency, not
#   because a world-rebuild is waiting.
#
# Shape of the run:
#   * analyze  — DRY-RUN every production cell (no build) against the configured
#                substituters (cache.nixos.org + R2) and emit a matrix of ONLY
#                the cells that still have something to build. On a warm cache
#                this is empty and the run finishes in a minute. This is the
#                "figure out what actually needs rebuilding first" step.
#   * seed     — one job PER (system, language, tier) cell that needs work. Each
#                cell is an independent, dynamically generated phase: the matrix
#                IS the phasing, so no single job ever has to compile the whole
#                fleet under GitHub's hard 6h ceiling. Each cell builds its image
#                and pushes its runtime closure to R2.
#
# SECURITY: workflow_dispatch / push-to-main only (never fork-PR triggerable)
# AND gated behind the `production` environment, because the seed jobs use the
# R2 WRITE credentials and the cache signing key. The PR gate only ever CONSUMES
# the cache via the public base URL + published public key (no secrets), so
# seeding never widens fork-PR exposure. Run it after changing the registry or
# the flake pin, on a branch or on main.

name: ClearCutt Seed Nix Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/lib/registry.nix'
      - 'core/flake.nix'
      - 'core/flake.lock'
      - 'clearcutt.fleet.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed-gate:
    name: Approve Cache Seeding
    runs-on: ubuntu-latest
    # Single manual approval gates the whole run; the R2 write secrets are only
    # reached by the seed jobs below, which inherit the gate via `needs`.
    environment: production
    steps:
      - name: Confirm seeding approved
        run: echo "Cache seeding approved for ${{ github.ref }}."

  analyze:
    name: Analyze Rebuild Set
    needs: [seed-gate]
    runs-on: ubuntu-latest
    outputs:
      seed_matrix: ${{ steps.analyze.outputs.seed_matrix }}
      has_work: ${{ steps.analyze.outputs.has_work }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Configure ClearCutt Nix Environment
        # Writes the substituter config (cache.nixos.org + the R2 public base
        # url) so the dry-run below reflects what is ALREADY cached.
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Compute cells that still need building
        id: analyze
        # For every production cell, ask Nix what it WOULD build (eval +
        # substituter query only — no compilation). The CLI owns matrix export,
        # dry-run parsing, eval-error handling, and GitHub output formatting so
        # Actions stays a thin orchestrator.
        run: ./clearcutt fleet seed-cache-plan --core-dir core --github-output "$GITHUB_OUTPUT"

  seed:
    name: Seed Cache (${{ matrix.system }} - ${{ matrix.language }} - ${{ matrix.tier }})
    needs: [seed-gate, analyze]
    if: ${{ needs.analyze.outputs.has_work == 'true' }}
    # Each cell is its own phase. The heaviest patched runtime (dotnet, ~3h
    # cold) sits well under GitHub's 6h job ceiling; we keep the PR gate's heavy
    # cap so a pathological cell fails loudly instead of burning the ceiling.
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.analyze.outputs.seed_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install ClearCutt CLI
        uses: ./.github/actions/install-clearcutt
        with:
          mode: ${{ vars.CLEARCUTT_CLI_MODE || 'release' }}
          version: ${{ vars.CLEARCUTT_CLI_VERSION || 'v0.17.0' }}
          repo: ${{ vars.CLEARCUTT_CLI_REPO || 'northcutted/clearcutt' }}

      - name: Configure ClearCutt Nix Environment
        run: ./clearcutt platform setup-nix --skip-warm --write-user-config --github-env "$GITHUB_ENV"

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Build And Certify Target
        # Builds the image and runs the full security gate, so a seed build also
        # re-proves the runtime-patch completeness gate (no stock openssl/sqlite
        # ships) before the closure is published.
        run: |
          ./clearcutt fleet certify-target \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

      - name: Publish Runtime Closure To Nix Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          ./clearcutt fleet publish-cache \
            --system "${{ matrix.system }}" \
            --language "${{ matrix.language }}" \
            --tier "${{ matrix.tier }}" \
            --core-dir core

  seed-summary:
    name: Seed Summary
    needs: [analyze, seed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ needs.analyze.outputs.has_work }}" != "true" ]; then
            echo "Cache already warm — nothing to seed."
            exit 0
          fi
          # `seed` is skipped-or-success when has_work; treat any seed failure as fatal.
          if [ "${{ needs.seed.result }}" != "success" ]; then
            echo "One or more seed cells failed: ${{ needs.seed.result }}"
            exit 1
          fi
          echo "All needed cells seeded to R2."
