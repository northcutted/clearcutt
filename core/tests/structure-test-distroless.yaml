schemaVersion: "2.0.0"

metadataTest:
  user: "10001:10001"
  workdir: "/app"
  envVars:
    - key: "HOME"
      value: "/app"
    - key: "TMPDIR"
      value: "/tmp"
    - key: "SSL_CERT_FILE"
      value: "/nix/store/.*/etc/ssl/certs/ca-bundle.crt"
      isRegex: true

fileExistenceTests:
  - name: 'App Directory'
    path: '/app'
    shouldExist: true
    permissions: 'drwxr-xr-x'
  - name: 'Tmp Directory'
    path: '/tmp'
    shouldExist: true
    # Sticky + world-writable: TMPDIR points here, and store-path layers
    # cannot provide this mode (canonicalization strips it).
    permissions: 'dtrwxrwxrwx'
  - name: 'Passwd File'
    path: '/etc/passwd'
    shouldExist: true
  - name: 'Group File'
    path: '/etc/group'
    shouldExist: true
  - name: 'CA Certificates Bundle'
    path: '/etc/ssl/certs/ca-bundle.crt'
    shouldExist: true
  - name: 'Bash Shell Absence'
    path: '/bin/bash'
    shouldExist: false
  - name: 'Sh Shell Absence'
    path: '/bin/sh'
    shouldExist: false
  - name: 'Ls Utility Absence'
    path: '/bin/ls'
    shouldExist: false
  - name: 'Cat Utility Absence'
    path: '/bin/cat'
    shouldExist: false
  - name: 'FHS Lib64 Loader Absence'
    path: '/lib64/ld-linux-x86-64.so.2'
    shouldExist: false
  - name: 'FHS Libc Absence'
    path: '/lib/libc.so.6'
    shouldExist: false
  - name: 'Usr Bin Ls Absence'
    path: '/usr/bin/ls'
    shouldExist: false
  - name: 'Usr Bin Cat Absence'
    path: '/usr/bin/cat'
    shouldExist: false
  - name: 'Npm Package Manager Absence'
    path: '/bin/npm'
    shouldExist: false
  - name: 'Npx Package Runner Absence'
    path: '/bin/npx'
    shouldExist: false
  - name: 'Corepack Package Manager Absence'
    path: '/bin/corepack'
    shouldExist: false
  - name: 'Jshell REPL Absence'
    path: '/bin/jshell'
    shouldExist: false
  - name: 'Javac Compiler Absence'
    path: '/bin/javac'
    shouldExist: false

fileContentTests:
  - name: 'Passwd Root User'
    path: '/etc/passwd'
    expectedContents:
      - ".*root:x:0:0:root:/root:/sbin/nologin.*"
  - name: 'Passwd App User'
    path: '/etc/passwd'
    expectedContents:
      - ".*appuser:x:10001:10001:ClearCutt Secure App User:/app:/sbin/nologin.*"
  - name: 'Group App User'
    path: '/etc/group'
    expectedContents:
      - ".*appuser:x:10001:.*"
