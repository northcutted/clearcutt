schemaVersion: "2.0.0"

metadataTest:
  user: "10001:10001"
  workdir: "/app"
  envVars:
    - key: "HOME"
      value: "/app"
    - key: "TMPDIR"
      value: "/tmp"
    - key: "SSL_CERT_FILE"
      value: "/nix/store/.*/etc/ssl/certs/ca-bundle.crt"
      isRegex: true

fileExistenceTests:
  - name: 'App Directory'
    path: '/app'
    shouldExist: true
    permissions: 'drwxr-xr-x'
  - name: 'Tmp Directory'
    path: '/tmp'
    shouldExist: true
  - name: 'Passwd File'
    path: '/etc/passwd'
    shouldExist: true
  - name: 'Group File'
    path: '/etc/group'
    shouldExist: true
  - name: 'CA Certificates Bundle'
    path: '/etc/ssl/certs/ca-bundle.crt'
    shouldExist: true
  - name: 'Bash Shell Absence'
    path: '/bin/bash'
    shouldExist: false
  - name: 'Sh Shell Absence'
    path: '/bin/sh'
    shouldExist: false
  - name: 'Ls Utility Absence'
    path: '/bin/ls'
    shouldExist: false
  - name: 'Cat Utility Absence'
    path: '/bin/cat'
    shouldExist: false
  - name: 'Usr Bin Ls Absence'
    path: '/usr/bin/ls'
    shouldExist: false
  - name: 'Usr Bin Cat Absence'
    path: '/usr/bin/cat'
    shouldExist: false

fileContentTests:
  - name: 'Passwd App User'
    path: '/etc/passwd'
    expectedContents:
      - ".*appuser:x:10001:10001:ClearCutt Secure App User:/app:/sbin/nologin.*"
  - name: 'Group App User'
    path: '/etc/group'
    expectedContents:
      - ".*appuser:x:10001:.*"
