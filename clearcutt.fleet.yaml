# yaml-language-server: $schema=./schemas/clearcutt-fleet.schema.json
apiVersion: clearcutt.dev/v1
kind: FleetConfig
metadata:
  name: clearcutt-reference-fleet
registry:
  host: ghcr.io
  owner: northcutted
  repository: clearcutt
  imagePrefix: clearcutt
branding:
  productName: ClearCutt
  vendor: ClearCutt
  authors: ClearCutt maintainers
site:
  title: ClearCutt Hardened Image Fleet
  pages: true
  basePath: /clearcutt
  description: Fork this kit to publish your own trusted base-image fleet, catalog, policies, and app-team templates under your GitHub OIDC identities.
matrix:
  systems:
    - x86_64-linux
    - aarch64-linux
  languages:
    # Four LTS runtime lines kept as reference fixtures: enough to demonstrate the
    # Nix build path, the three tiers, and multi-arch evidence, without operating a
    # production image fleet. ClearCutt's product is governing image estates, not
    # publishing them.
    - java21
    - node22
    - python3.14
    - go1.26
  tiers:
    - dev
    - slim
    - distroless
release:
  sourceBranch: main
  workflowIdentity: https://github.com/northcutted/clearcutt/.github/workflows/release.yml@refs/heads/main
  slsaBuilder: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
  nixCache:
    bucket: clearcutt-nix-cache
    publicBaseUrl: https://nix-cache.clearcutt.dev
    signingKeyName: clearcutt-cache-1
    publicKey: clearcutt-cache-1:0O2A23T11EBggh2Uz+LJcaRMBpuS9eUjeWmXKP0QoDE=
    cloudflareZoneName: clearcutt.dev
catalog:
  releaseLimit: 10
  scanDepth: "4"
  scanAll: false
admission:
  engine: kyverno
  environment: production
  namespace: apps
  denyDevTier: true
  requireSlsa: true
  requireSbom: true
  requireSignature: true
  requireDigest: true
remediation:
  mode: approved-pr
  scanDepth: "1"
  maxFindingsPerRun: 1
  maxPatchFailuresPerRun: 1
  includeDevOnly: false
  policy:
    productionTiers:
      - slim
      - distroless
    minimumSeverity: high
    requireRuntimeLayer: true
    requireFixedVersion: true
    epssPercentileBoostAt: 0.90
    kevBoost: true
    # How the known-good crypto build (openssl/sqlite) is trusted. nixpkgs
    # (default): trust the pin's patched build, substitute from cache, and VEX
    # the scanner version gap. reproduce: also independently rebuild the crypto
    # closure and byte-compare it against the substituted build (trust AND
    # verify); a divergence fails the release evidence.
    cryptoTrust: nixpkgs
  unstable:
    # Default-off opt-in for sourcing a CVE fix from a newer nixpkgs when the
    # stable pin lacks it. `suggest` = scans surface an available unstable fix
    # but never auto-apply; a soft opt-in scopes ONE package to a pinned ref.
    mode: suggest
    ref: github:NixOS/nixpkgs/nixpkgs-unstable
    softOptIns:
      - package: nodejs_22
        ref: github:NixOS/nixpkgs/89570f24e97e614aa34aa9ab1c927b6578a43775
        reason: nodejs 22.23.0 fixes CVE-2026-48617/48937; not yet in the stable pin
        owner: ClearCutt maintainers
        fixes:
          - cve: CVE-2026-48617
            installedVersion: 22.22.3
            fixedVersion: 22.23.0
          - cve: CVE-2026-48937
            installedVersion: 22.22.3
            fixedVersion: 22.23.0
templates:
  runtimes:
    - java
    - node
    - python
    - go
