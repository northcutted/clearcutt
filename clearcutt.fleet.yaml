apiVersion: clearcutt.dev/v1
kind: FleetConfig
metadata:
  name: clearcutt-reference-fleet
registry:
  host: ghcr.io
  owner: northcutted
  repository: clearcutt
  imagePrefix: clearcutt
branding:
  productName: ClearCutt
  vendor: ClearCutt
  authors: ClearCutt maintainers
site:
  title: ClearCutt Hardened Image Fleet
  pages: true
  basePath: /clearcutt
  description: Fork this kit to publish your own trusted base-image fleet, catalog, policies, and app-team templates under your GitHub OIDC identities.
matrix:
  systems:
    - x86_64-linux
    - aarch64-linux
  languages:
    - coreLTS
    - java21
    - java25
    - node22
    - node24
    - python3.15
    - go1.25
    - go1.26
    - dotnet8
    - dotnet10
    - rust1.95
    - cc15
  tiers:
    - dev
    - slim
    - distroless
release:
  sourceBranch: main
  workflowIdentity: https://github.com/northcutted/clearcutt/.github/workflows/release.yml@refs/heads/main
  slsaBuilder: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
  nixCache:
    bucket: clearcutt-nix-cache
    publicBaseUrl: https://nix-cache.clearcutt.dev
    signingKeyName: clearcutt-cache-1
    publicKey: clearcutt-cache-1:0O2A23T11EBggh2Uz+LJcaRMBpuS9eUjeWmXKP0QoDE=
    cloudflareZoneName: clearcutt.dev
rebase:
  workflowIdentity: https://github.com/northcutted/clearcutt/.github/workflows/rebase.yml@refs/heads/main
catalog:
  releaseLimit: 10
  scanDepth: "4"
  scanAll: false
admission:
  engine: kyverno
  environment: production
  namespace: apps
  denyDevTier: true
  requireSlsa: true
  requireSbom: true
  requireSignature: true
  requireDigest: true
remediation:
  mode: approved-pr
  scanDepth: "1"
  maxFindingsPerRun: 1
  maxPatchFailuresPerRun: 1
  includeDevOnly: false
  policy:
    productionTiers:
      - slim
      - distroless
    minimumSeverity: high
    requireRuntimeLayer: true
    requireFixedVersion: true
    epssPercentileBoostAt: 0.90
    kevBoost: true
templates:
  runtimes:
    - java
    - node
    - python
    - go
services:
  - id: postgres16
    template: postgres
    version: "16"
    description: Postgres database service image
    packageCandidates:
      - postgresql_16
    ports:
      - name: postgres
        port: 5432
        protocol: tcp
    stateful: true
    dataDirs:
      - /var/lib/postgresql/data
    env:
      - PGDATA=/var/lib/postgresql/data
    entrypoint:
      - clearcutt-postgres-entrypoint
    smoke:
      - postgres --version
      - initdb --version
      - pg_isready --version
    lifecycle:
      status: preview
      support: current
    productionAllowed: false
  - id: valkey8
    template: valkey
    version: "8"
    description: Valkey in-memory data store service image
    packageCandidates:
      - valkey
    ports:
      - name: redis
        port: 6379
        protocol: tcp
    stateful: true
    dataDirs:
      - /data
    entrypoint:
      - valkey-server
    smoke:
      - valkey-server --version
      - valkey-cli --version
    lifecycle:
      status: preview
      support: current
    productionAllowed: false
  - id: oauth2-proxy7
    template: oauth2-proxy
    version: "7"
    description: oauth2-proxy authentication gateway service image
    packageCandidates:
      - oauth2-proxy
    ports:
      - name: http
        port: 4180
        protocol: tcp
    stateful: false
    entrypoint:
      - oauth2-proxy
    smoke:
      - oauth2-proxy --version
    lifecycle:
      status: preview
      support: current
    productionAllowed: false
