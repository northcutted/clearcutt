# ClearCutt repo-scoped Codex defaults.
# Personal credentials, MCP auth, and aggressive permission changes belong in ~/.codex/config.toml.

model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
project_doc_max_bytes = 65536

[features]
hooks = true
multi_agent = true
shell_snapshot = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
